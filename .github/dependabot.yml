# ワークフローと依存の更新を提案させる（ピン留めしたハッシュと版のコメントを一緒に更新する）。
# 新しいリリースが公開されてすぐに提案しないよう、冷却期間を置く。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # まとめるのはパッチの更新だけにする。Dependabot は 0.x の 0.8 → 0.9 もマイナーと数えるが、
    # Cargo ではそれが互換を壊す更新になるので、マイナーまでまとめると直しの要る更新が混ざる。
    # マイナーとメジャーは依存ごとに一つずつ提案させる
    groups:
      cargo-patches:
        patterns: ["*"]
        update-types: ["patch"]
