name: Release

on:
  push:
    tags: ["v*"]

# 読み取りだけを既定にする。リリースを作るジョブが contents: write を自分で宣言する
permissions:
  contents: read

# 公開は直列にし、走っている公開を中断しない
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# bash --noprofile --norc -eo pipefail で走らせる（パイプの中の失敗でも止まる）
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify the tag matches the version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Check the tag against the canonical version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/check-release-version.sh

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          # TODO: Windows support (separate cycle)
          # - target: x86_64-pc-windows-msvc
          #   os: windows-2025
          #   archive: zip

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Add the build target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # リリースのワークフローではキャッシュを使わない（汚染されたキャッシュで公開しない）
      # ため、ビルドのキャッシュは置かない。

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake nasm

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "target/$TARGET/release"
          tar czf "../../../remote-merge-$TARGET.tar.gz" remote-merge
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          Compress-Archive -Path "target/$env:TARGET/release/remote-merge.exe" -DestinationPath "remote-merge-$env:TARGET.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: remote-merge-${{ matrix.target }}
          path: remote-merge-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # リリースを作るのに要る（ほかは読み取りだけ）
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum remote-merge-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/create-release.sh
