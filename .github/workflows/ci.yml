name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# 読み取りだけを既定にする（書き込むジョブは自分の permissions で広げる）
permissions:
  contents: read

# 同じブランチ・PR への新しい push が、走っている検査を置き換える
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# bash --noprofile --norc -eo pipefail で走らせる（パイプの中の失敗でも止まる）
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tests/container-e2e/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install pinned kotowari
        run: cargo install --git https://github.com/ba0918/kotowari.git --rev 5fe0f2998273e8f831e1ba4a5724bc34e57e4816 --locked kotowari

      - name: Check specifications
        run: kotowari check --format json

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install fish for the login shell tests
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Run tests
        env:
          REMOTE_MERGE_TEST_REQUIRE_FISH: "1"
          # 配置テストはこの CLI をエージェントに使うため、デバッグ情報で 100MB 上限を超えないようにする。
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          test_home=$(mktemp -d)
          trap 'rm -rf -- "$test_home"' EXIT
          mkdir -p "$test_home/config" "$test_home/data"
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/config" XDG_DATA_HOME="$test_home/data" cargo test --workspace --all-features --locked

  container-e2e:
    name: OpenSSH and sudo (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install musl build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake nasm

      - name: Verify real OpenSSH and sudo
        run: scripts/run-container-e2e.sh

  build-musl:
    name: Build (musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake nasm

      - name: Build (musl)
        run: cargo build --target x86_64-unknown-linux-musl

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Add the coverage component
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-llvm-cov

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --ignore-filename-regex='main\.rs'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-report
          path: lcov.info

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: msrv-1.89.0

      - name: Check with the MSRV toolchain
        run: cargo +1.89.0 check --workspace --locked
