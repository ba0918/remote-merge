[workspace]
members = ["crates/remote-merge", "crates/remote-merge-core", "crates/remote-merge-protocol", "crates/remote-merge-settings", "crates/remote-merge-ssh", "crates/remote-merge-config", "crates/remote-merge-agent", "crates/remote-merge-engine"]
default-members = ["crates/remote-merge", "crates/remote-merge-core", "crates/remote-merge-protocol", "crates/remote-merge-settings", "crates/remote-merge-ssh", "crates/remote-merge-config", "crates/remote-merge-agent", "crates/remote-merge-engine"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
needless_pass_by_value = "warn"
undocumented_unsafe_blocks = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
strip = true

# 依存だけを最適化する。テストは上限を超える 100 MB 級の中身を SSH の暗号と SHA-256 に通すので、
# 最適化しない依存では遅い。ワークスペースのクレートは最適化せず、デバッグのしやすさを保つ。
[profile.dev.package."*"]
opt-level = 2
