[package]
name = "remote-merge-container-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
serde_json = "1"
toml = "1"
tempfile = "3"
serial_test = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
needless_pass_by_value = "warn"
undocumented_unsafe_blocks = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[lints]
workspace = true
