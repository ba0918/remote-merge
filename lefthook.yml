pre-commit:
  commands:
    rustfmt:
      run: cargo fmt --all --check
    specification:
      run: kotowari check --format json --allow-test-findings

pre-push:
  commands:
    clippy:
      run: cargo clippy --all-targets --all-features -- -D warnings
    normal-tests:
      run: cargo test --all-features
    specification:
      run: kotowari check --format json
