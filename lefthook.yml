pre-commit:
  commands:
    rustfmt:
      run: cargo fmt --all --check
    specification:
      run: kotowari check --format json --allow-test-findings

pre-push:
  commands:
    clippy:
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    normal-tests:
      run: cargo test --workspace --all-features --locked
    specification:
      run: kotowari check --format json
