# 上限を当てずに 104,857,600 バイトを超える中身を実際に読むテストは、一つで数百 MB のメモリを使う。
# この組のテストは同時に一つだけ走らせる。
[test-groups]
oversized-reads = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^size_limit::(req_cli_074_force_lets_merge_write_a_file_over_the_limit|req_cli_094_status_compares_the_contents_of_files_over_the_limit|ex_cli_082_force_lets_diff_compare_files_over_the_limit|ex_cli_083_force_backs_up_a_file_over_the_limit_before_deleting_it|req_cli_079_force_backs_up_a_file_over_the_limit_before_rollback_restores_it)$/)'
test-group = 'oversized-reads'
