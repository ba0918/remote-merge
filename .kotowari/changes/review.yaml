    reason: 固定した比較元と対象を独立に照合し、8ファイルのblobとmode、既存依存の指定とlockの外部依存辺、製品版の維持を確認した。同名の再公開は型の複製を伴わず、実測のテスト集合は170件の所属変更だけで残る2939件と無視状態を保つ。変異検査の実行出力は両crateの単体と従来のcontract・cli_diffの2917件を含み、限定した既存2変異の照合も一致する。ソースインストールとmusl・Docker・coverageの成功出力、前後で同じヘルプと版表示を確認した。配置と検査対象の変更は承認済み決定の範囲内であり、製品の要件・IR・テスト期待値を変えていない。
