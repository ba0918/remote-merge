    conclusion: existing
    reason: >-
      REQ-merge-001(種類の違う既存の書き込み先を変更せず理由付きでスキップする)とEX-merge-001
      (書き込み先のリンクとリンク先が変わらない)は既存の要求のままで、この差分はTUIの単一マージ・
      hunkマージ・変更の書き込みをその要求に合わせるだけである。merge_exec.rsのrefuse_different_kindは
      determine_merge_actionのSkipDifferentKindで書き込み前に止め、dialog_keys.rsは確認のyでmtime検査より
      先に同じ判定を行うので、書き込みへ進めるmtime警告を開かずにスキップする。別の作業コピーで
      dialog_keys.rsを4fa5ea3の版に戻すと4件の契約テストがいずれもダイアログが開いた時点の検査で失敗し、
      cc47936の版に戻しても同じく失敗することを実測した。理由の文言はFLAG-merge-008で未決であり、
      状態表示の欄もIRに契約として書かれていないため、テストが文言を固定しないのは証拠条件に沿う。
      その代わり理由の表示はテストで確かめておらず、理由を出さない改変でも4件とも成功することを
      実測したので、理由付きの部分は人の確認に委ねる。IR・要求・決定の変更は要らない。
    requirements:
      - REQ-merge-001
    decisions: []
    handoff: null
    gaps: []
