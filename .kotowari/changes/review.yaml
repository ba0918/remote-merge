    conclusion: new
    reason: >-
      固定baseから対象までの全code・document差分を参照された実出力と独立に照合した。
      十名・十一自由関数定義の全本文・docs・cfg・コメントは十一可視性、旧truncation warn target明記と保存されたhash signature一行化だけを戻すと元bytesに一致する。
      TargetPathの三variant・fields・deriveは下位pub化だけで同一である。検査本文はroot引数とself.root置換、二Self helper参照と正確な四space dedentだけで一致し、二helperもそのdedentと一Self参照置換だけで一致する。
      lower全fileはこの閉じたblock集合と既存型importだけで構成される。新算法・trait・registryやproductionの複製はない。
      製品二file全体は移動block除去、private再公開、未使用Path・FileHashResult import除去、検査委譲と削除後separator除去だけで元本文から復元できる。
      八通常helperと二cfg(test) helperの再公開、private runtime moduleとTargetPath aliasを維持し、lower二helperはprivateである。
      LocalTargetIoの他method・validated_path、全RemoteTargetIo、CoreRuntime method・Agent変換・remote fallback・constants・delegate macroと混在test本文は不変である。
      inspectionは元のvalidate_remote_pathを使い、validated_pathへ置き換えない。絶対入力を一律拒否する強化ではなく、traversalと絶対入力の元の結果・errorを保つ比較である。
      hashのError skip・生symlink target、stat順序・欠損None・秒精度、missing-parent walk・canonical NotFound・chmod両cfgとsymlink削除作成順序・error chainは全文一致で維持される。
      製品protocol再公開とengine直接依存は同じFileHashResultを参照し、FileNodeは両方coreの実体である。実compileされたprobeのfunction pointerは十helperと検査のprotocol/core/chrono signatureを確認する。
      元free block・enum・検査methodと二helperのproducer bytesを固定baseと独立照合した。probeだけのroot holderと未使用runtime引数stand-inによる旧算法再現であり、旧CLI全体の実行ではない。
      実compile/run出力とprobe sourceを確認し、自分の一時領域だけでfile・directory・relative/absolute symlink・missing target・cycle、hash/map/stat/tree、検査variant・全error chainとUnix操作を旧新比較している。
      実利用者profileやnetwork・外部書き込みを検証したとは扱わない。四privacy probeは三E0603とcfg(test)不在のE0425、各exit101の意図した拒否であり通常build成功ではない。
      全3109collection identityとmetadataはowner・binary・名前・prefix・属性を無変換で保ち、製品lib1418・engine358である。core51とside_io116の全167件は実final PASS行と一致する。2917件は狭い収集であって追加実行ではない。
      全parsed manifest・lockはengineから既存protocolへの一通常path依存と一lock辺だけを戻すと一致する。全実metadataもその一依存以外一致し、八member・default-member、既存外部版・checksum・feature・他辺・製品0.2.13と通信v4を保つ。
      全十pathの閉じた差分を確認し、mutant mappings、他caller・crate・test・IR・契約・scriptは不変である。PROJECTとA1・D1〜D5はこの所属変更に対応し、新仕様・恒久oracle・変異gateを加えない。
      保存されたcommand-ledgerの全commandとexitを実fileへ照合し、baselineと修正後candidateの通常2999・全feature3109、Clippy・Linux install・musl・Docker六件と二件、version/help全bytes一致を確認した。
      preflightのAgent同名過一致は初回exit未収集、patch comma拒否はrunner exitなしと区別する。fmt exit1・unused import Clippy101・privacy期待値comparator1は保存された失敗であり、成功と読み替えない。
      unchanged TUI quit testは通常Cargoで十五秒終了待ちに失敗しexit101、isolatedとserial全suite、final通常nextestと両通常hookは成功している。原因やscheduling感度は未証明でtest/runtime修復もない。
      coverageはregion81395から81401・function4676から4677へ変わり、各未到達7685・294とline49216・未到達4758、丸め率だけを保つ。全count・出力bytes一致ではない。
      全追加行のcredential・account path・秘密鍵・unsafe/process追加scanと安全上重要な直接保存復元caller・関連merge/rollback契約を確認し、新安全判断や依存上向きを持ち込まない。
      warnのlevel・message・args・旧targetは静的比較で確認したがsubscriber eventは未収集で、動的logging・source location同一性・macOSとnonUnix実行は未検証である。
