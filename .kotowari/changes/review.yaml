  reason: ホスト鍵の判定を純粋な judge_host_key に切り出し、失効の行を通常の行より先に見る（A2、REQ-ssh-013。空白の並びやタブの区切りも OpenSSH と同じく読む）。別の鍵種別でだけ登録されたホストは、以前は新しい種別を追記して信頼していたが、未知の鍵として確認に回す（A5 は REQ-ssh-001・REQ-ssh-002 から導いた解釈で、IR には例 EX-ssh-026 だけを足した）。承認直後の再接続は承認した鍵の種別と base64 に完全に一致する鍵だけを受け入れる（REQ-ssh-001）。ファイルがないこと以外の known_hosts の読み込みの失敗はエラーとして接続を止める（A1、REQ-ssh-012）。SSH クライアントの sudo 付きの書き込みは sudo=true の配置先へ Agent を書くためのもので（A12、REQ-ssh-015・EX-ssh-029）、既存の書き込みは変えていない。試験サーバの変更は鍵の取得と、A11 の直した配置先で版の確認を省いたときの、パスを含まないターゲットの確認コマンドの受け入れだけである。REQ-ssh-001・012・013 の印の付いた契約テストは、止まること、リモートのコマンドが走らないこと、known_hosts が変わらないことを確かめ、要件と一致する。
