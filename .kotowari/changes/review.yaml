    sha256: sha256:e6960a904f30c4a8d1ffe77d7b3f30133d5f5a4727445e5ff12cf0030ae74bd0
  conclusion: existing
  reason: Agent の書き込みと symlink の作成先を、親までは従来どおり root_dir の内側と確かめたうえで最後の要素を辿らずに解決し、通常ファイルは O_NOFOLLOW で開くので、既存の symlink への書き込みはリンクもリンク先も変えずにエラーになる（REQ-merge-001 が禁じる種類の置き換えも、書き込み先の外への書き込みもしない）。symlink の作り直しはリンクそのものに行いリンク先を消さない（REQ-merge-003）。モードと所有者は書き込んだ開いたファイルに fchmod・fchown で設定し、後からパスを symlink に差し替えられてもリンク先を変えない。エラーにすることは要件の範囲で残る唯一の扱いとして A6 に残っており、新しい意味の選択を足していない。単体テストの期待は要件と一致する。
  requirements:
  - REQ-merge-001
  - REQ-merge-003
  decisions:
  - docs/decision/records/2026-10-05-harden-security.md#A6
  handoff: null
