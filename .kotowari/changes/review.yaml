  conclusion: new
  reason: "run_command_bytes は終了ステータスなしで終わったチャネルを SshConnection にし、途中で切れた一括読み込みを REQ-ssh-003 の再試行の対象にする（ssh_integration の batch_read_cut_off_without_exit_status_is_a_connection_error）。走査の起点の test -d は終了コード 1 だけを REQ-scan-015 の RemoteRootNotFound にし、他は SshExec か接続エラーのまま返す（only_a_failed_root_check_means_the_scan_root_is_missing）。リモートの削除は -f のない rm -- を exec_strict で実行してないパスを失敗にし（A4・A9、REQ-merge-034・REQ-merge-041）、symlink の作成は mkdir -p の後に ln -s -T --、使えないときだけ作成先が空かを確かめて ln -s -- で作り、終了コードを検査する（REQ-merge-023、A7・A10、REQ-merge-040、EX-merge-049）。書き込みは write_in_place が cat / openssl の有無を command -v で確かめてから dd の oflag=nofollow で書き込み先をその場で開き、fd 3 で書き込み元の終了ステータスも確かめる（A1・A11、REQ-merge-038・REQ-merge-039、所有者・権限・ハードリンクを保つので REQ-merge-013・REQ-backup-029 と合う）。コマンドが見つからないときは書き込み先を開かずに失敗することは A11 の補いとして決定記録の改訂と REQ-merge-039 に書かれ、a_binary_write_without_openssl_fails_and_keeps_the_destination（dd の nofollow の有無の両方、各ログインシェル）がそれを確かめるのをコードと突き合わせた。dd が nofollow を受け付けないときに残る確認と書き込みの間の競合は REQ-merge-038 に書かれている。すべてのコマンドは sh -c に包んで送る（A5、REQ-ssh-020）。sudo の書き込みは包む以外は変えていない。契約テストの印（REQ-merge-017・019・023・034、EX-merge-049）は要件の文と期待が合う。REQ-merge-038〜041 は A14 のとおり verification: review で how_to_verify が実在の単体テストを指す。変更は承認された計画の範囲（A1〜A4）と利用者が決めた H1〜H3・J1〜J4、承認された A8〜A10 の中にあり、A2 は A7 で、A8 は A11 で置き換えられている。"
