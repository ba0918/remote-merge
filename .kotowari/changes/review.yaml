  reason: "ローカルの書き込みを std::fs::write から、作成・切り詰めは同じで O_NOFOLLOW を付けて開く書き込みに替え、最後の要素が既存の symlink ならリンクもリンク先も変えずに失敗する（A3、REQ-merge-038、REQ-merge-001）。途中の要素の symlink は O_NOFOLLOW の対象外で REQ-merge-004 のとおり辿る。unix 以外は今までどおり書く。engine に unix 向けの libc を足し、Cargo.lock の差分は engine の依存の一覧に libc が一行加わるだけである。比べたときに symlink だった書き込み先は merge_flow が先に消すので、通常の merge の動作は変わらない。"
  requirements:
  - REQ-merge-001
  - REQ-merge-004
  - REQ-merge-038
