    conclusion: new
    reason: >-
      固定した比較元から対象までの全差分、承認された境界と参照された実出力を独立に照合した。
      四ファイルの全bytesとmodeは五つのlocal warnと二つのexecutor infoの旧target引数およびvalidator一個の可視性だけを戻すと一致し、backupとoptimistic_lockは無変換で一致する。
      全test moduleの本文・cfg・コメント・期待値は不変で、全3109件の収集結果はlocal31・backup12・executor19・optimistic_lock19件のpackageとlib binary ownerだけを対応付けて一致し、名前・接頭辞・属性と他3028件は無変換で一致する。
      移動81件全てに実際のPASS行がある。2917件の狭い選択は収集結果だけで、追加の実行成功とは扱わない。
      製品の四facadeを全bytesで確認し、executorは元の八公開項目だけを明示的に再公開し、同じvalidatorを別にpub(crate)で再公開する。
      下位normalize_pathはpub(crate)のままで、validator本文・製品runtimeの直接callerと既存契約は変わらない。
      private root別名はcoreのdiff・error・filter・treeを使い、private config moduleは元のconfig型と上限を使い、AuthMethodとDEFAULT_MAX_SCAN_ENTRIESはtest cfgだけに留める。
      backupのBACKUP_DIR_NAME直接再公開は元の行と同一で正本をconfigから移さない。
      consumerの実compileとrunは旧新のnominal型、core/config入力、元関数署名の選択した集合、Default・accessor・定数とhunk方向の互換性を確認し、全関数を動かしたとは主張しない。
      製品validatorと下位normalizerへの外部参照は意図したCargo 101のE0603として通常検査から区別した。
      全parsed manifestとlockは第八member・新内部packageと製品path辺だけを除いて一致し、既存metadata全packageも新辺だけを除いて一致する。
      外部版・checksum・feature指定と旧依存辺は変えず、SSH・Agentやconfigからengineへの辺を足さない。
      同等変異一覧はbackupの二file値だけを変更し、rationaleと他entryは全bytes同一であり、新たな同等性判定や変異実行ではない。
      全実出力のcommandとexitを照合し、前後の通常2999件と全feature・最終3109件、Linux install・musl・Docker・coverageの実成功と同一version/help表示を確認した。
      Coverageの丸めた率は同じだが未到達regionは7683から7685、lineは4757から4758であり、countやbytesが同じとは扱わない。
      初回alias順序のfmt失敗と無効なstaged changesのexit2は成功と扱わず、修正後の全順序検査と固定baseのcommitted検査を区別した。
      七ログは静的照合だけで動的captureとmacOSは未検証、file・line・module_pathの維持も主張しない。
      全追加行のcredentialとhome path一致は元の空値と架空fixtureだけで秘密鍵の追加はない。
      PROJECTと決定A1・D1〜D5はこの閉じた所属変更に一致し、新IR・要件・policy test・必須変異検査と残るengine抽出を追加しないと判断する。
