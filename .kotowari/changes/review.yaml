    sha256: "sha256:06fb2b3b5e8170182119eb8411934214e6b0513e55687ca58e8d427718cf0f61"
  conclusion: existing
  reason: "一括読み込みの出力を、ファイルごとの F<i> <バイト数>・中身・S<i> <cat の終了コード>、通常ファイルでないか読めないときの E<i>、最後の END<件数> の形式に替え、中身をバイト数で切り出す。終了コード 0 のファイルだけを結果に入れ、形式が合わない出力は全体を Err にするので、読めないファイルを空の中身にしない（REQ-merge-017）。結果から外れたパスは呼び出し元の一件ずつの読み込みで失敗が報告され、契約テスト an_unreadable_remote_file_fails_the_merge_instead_of_reading_as_empty が \"read failed: right: \" の形（REQ-merge-019）を確かめる。分割の見積もりは REQ-ssh-020 の sh -c の包みで増える長さ（単一引用符とバックスラッシュ 1 バイトごとに 3 バイトと前後の 8 バイト）を含めた。どれも既存の要件の文の中に収まる。"
  requirements:
