    conclusion: existing
    reason: >-
      cc47936から20ef1a0までの比較全体を読んだ。追加されたのはmerge_exec.rsのrefuse_different_kindと
      refuse_selected_different_kind、それをexecute_hunk_mergeのhunk適用前とexecute_write_changesの
      バックアップと両側書き込みの前に置く早期終了、dialog_keys.rsで単一マージ確認・HunkMergePreview・
      WriteConfirmationのyでmtime検査より前に同じ判定を行う変更、契約テストと共通の準備関数だけである。
      判定は既存のdetermine_merge_actionのSkipDifferentKindをそのまま使い、左右の順に依らない対称な判定なので
      書き込みの向きを問わず、種類の違う既存の書き込み先を変更せず理由付きでスキップするというREQ-merge-001と、
      リンクとリンク先が変わらないというEX-merge-001に収まる。種類が同じ組では従来どおりmtime検査と書き込みへ
      進み、EX-merge-002の通常マージは変わらない。IRに定めのない新しい振る舞いや要求の変更はない。
      別の作業ツリーでdialog_keys.rsだけを4fa5ea3の版に戻すと、リンク先をリンクより古くした4つの契約テストが
      理由の表示を欠いて失敗し、20ef1a0では34件のTUI契約テストが成功することを実測した。
      HunkMergePreviewを開く本番コードがないことと、理由の文言がFLAG-merge-008の未決事項であることは人の判断に
      残っている。
    requirements:
      - REQ-merge-001
    decisions: []
    handoff: null
    gaps: []
