    reason: 固定した比較元と対象を独立に照合し、移動した通信処理と14テストの本文が版生成ブロック以外で完全一致し、Git modeも維持されることを確認した。単一の通信版リテラルから生成する公開マクロは別packageの実測で呼出元の版を使い、製品側の旧公開パスとpub constの型・0.2.13の版表示を保つ。全3109テストの集合は14件の所属と接頭辞だけが変わり、残る3095件と無視状態は一致する。外部lock依存と既存依存指定は同一で、追加は承認済み内部crateとpath依存だけである。既存スクリプトの実行ログで3ライブラリとcontract・cli_diffの2917件、および限定したformat_handshake変異1件の検知を確認した。インストール・musl・Docker・coverageの成功出力と同じヘルプ・版表示も確認し、配置と説明の変更は承認済み決定の範囲内と判断する。回復した2検査の失敗は保存され原因未確定と報告されており、失敗した実行を成功とは扱っていない。製品要件・IR・テスト期待値の変更はない。
