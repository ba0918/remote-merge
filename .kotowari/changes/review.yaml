    reason: 固定した比較元と対象の全差分を独立に照合した。新settings本文はstdのPathBuf importと承認済み5型・Debug・Defaultの元ブロックに完全一致し、Git modeも保たれる。製品configの残る本文と全テストはブロック削除と単一の再公開以外で一致し、利用側の認証・ホストキー確認・パス処理は変更されていない。全3109テストの所属・名前・属性が対応変更なしで一致し、既存89件のconfig検査の成功出力を確認した。公開パスの実測では5型がsettings型へ直接代入でき、既存trait、パスワードNone表示、300秒・Ask・false・falseのDefaultを保つ。パスワード伏字は元Debug本文と既存検査の成功で確認した。内部版0.1.0・edition 2021・publish=falseの新crateは依存・featureを持たず通常検査のmembersとdefault-membersに入る。全外部lockレコードと既存manifest・metadataは新ローカルpackageと製品の依存辺を除き一致する。前後のインストール・版とヘルプ・musl・Docker・coverage、および最終全テストの実出力を確認した。macOSの成功や未実行の変異は主張しない。配置説明と決定記録もA1〜A3を具体化する範囲内であり、新しい製品要件・IR・テストや将来のSSH境界判断を含まない抽出と判断する。
