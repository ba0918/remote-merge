    conclusion: new
    reason: >-
      固定baseから対象までの全差分と参照された実出力を独立に照合した。
      sync・rollbackは元の全blobとmodeに無変換で一致し、mergeの二importとstatusのclassifier import・call・enum・doc参照だけを戻すと残る二ファイルも完全一致する。
      全test moduleの本文・cfg・属性・期待値とprivate helpersを変えず、製品の四facadeはcanonical moduleのglob再公開一行だけで旧公開APIと実体を保つ。
      全3109件の収集identityとmetadataはstatus60・merge30・sync11・rollback24の125ownerだけを対応させると一致し、名前・接頭辞と他2984件は不変である。
      製品lib1418・engine358であり、製品badge20件のidentityとtest module全bytesは残る。移動125件には実PASS行があり、狭い2917件は収集だけで追加実行とは扱わない。
      下位二classifierの本文はenum名だけを元に戻すと旧本文に一致する。製品二関数のbodyだけを戻すとapp/three_way全blobが一致し、signature・badge enum・Conflict・docs・label/style・testsを変えない。
      全四file variantと二line variantの写像にwildcardはなく、下位への引数順と各戻り値の対応も同じである。旧行算法が返さないConflictを新しく検出しない。
      GUI変更は純粋な比較を下位へ委ねる二bodyだけであり、状態のowner・画面構成・event・dialog・focus・redrawは変えず、表示は既存badgeとpaletteに保つ。
      consumerの実compile・runと列挙した型・関数pointerを照合し、九つのservice公開型のnominal同一性、全公開merge・sync・rollback署名と選択したstatus署名、製品badge署名・style型を確認した。
      baseline sourceは固定baseの元app/three_way production prefixと全bytes一致しhashも確認した。probeのtheme別名で再現した旧関数・style producerであり、旧CLI全体の再実行ではない。
      実probeは32bool組合せと64Option行triplesで旧producer・下位・製品写像を比較し、dark/light両paletteで四file・三line badgeのlabel/styleを照合する。全入力域を実行したとの主張や恒久policy testは加えない。
      全parsed manifest・lockはengine通常glob-match一辺だけを除くと一致し、metadata全体もこの宣言だけを除いて一致する。元製品の0.2指定を採用し、既存外部版・checksum・feature・他辺と八member、製品0.2.13・protocol v4を変えない。
      型参照は既存Side・core・backup・DTOに閉じ、外部private helper橋渡し・restricted visibility変更・app namespace・UI/runtimeや上向き依存を加えない。
      全追加行のcredential・account path・秘密鍵・unsafe・process起動scanは零件であり、直接CLI guard、runtime restore callerと関連path契約も同じcanonical判断を通る。
      前後の通常2999件と全feature3109件、Clippy、Linux install・musl・Docker六件と二件、version/helpの実出力を確認した。
      初回fmtのmapping brace失敗とcomparatorのdoc参照誤countはexit1として残り、修正後comparisonの成功から再実行した全final Cargo testsと通常nextest、二commit hookは3109成功・skipなしである。
      以前のPTY失敗はこのunitの成功で原因を証明したことにはならず、test/runtimeを修復したとも扱わない。
      Coverageはregion81377から81395、function4674から4676、line49192から49220へ増える。未到達7685・294・4758と丸め率だけが同じであり、全count・bytesやper-file一致とは扱わない。
      四sourceにログsiteはなく動的captureとmacOSは未検証である。source-location metadataの同一性も主張しない。
      PROJECTと決定A1・D1〜D5はこの閉じた所属と表示分離に対応し、他callers・基礎実装・共有型・IR・変異mapping・policy test・残る抽出を変更しないと判断する。
