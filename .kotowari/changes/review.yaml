    reason: 固定した比較元と対象の全差分および根拠の実出力を独立に照合した。coreのprivate別名と元backup定数の追加、単一参照とhelper可視性の変更、三つの正確なwarn target引数だけを逆変換すると旧configの全bytesとmodeに一致する。全テスト本文・cfg・期待値はそのままで、収集結果の全3109件は89件のownerとconfig接頭辞だけを対応付けて一致し、3020件は無変換で一致する。候補configの89件には実際のPASS出力がある。製品facadeの公開26項目は元の集合に一致し、Raw型・新backup定数・helperを製品configから追加公開しない。helperの製品crate内可視性は維持され、外部アクセスのE0603と製品config定数アクセスのE0425は意図した拒否として通常検査と区別した。consumerの実行成功とソースから全公開型、settingsの五型、coreのResultとbackup定数の同一性を確認した。backupの残る全本文、認証利用側、読み込み順序・既定値・serde・検証・エラー・機密フィルターと除外は変更されていない。新crateから上位の製品やSSHへ依存せず、全lockと既存metadataは新しいlocal packageと製品からの辺だけを除き一致する。manifestは元の依存指定とfeatureを使い、六つの通常memberに含まれる。三ログの旧target・level・message・引数と分岐は静的に照合しただけで、動的イベント、file・line・module_pathの維持やmacOS成功を主張しない。前後と最終の通常検査およびLinux install・表示・musl・Docker・coverageの実出力を確認した。初回fmt失敗は修正後の全順序再実行と区別し、初回path scanの未採取exitも成功と扱わない。47個のhome形式と10個のcredential形式の追加行は元のfixtureまたは宣言と一致し、環境情報の追加ではない。PROJECTと決定の説明は委任されたA1・A2と具体設計D1〜D4に一致し、新IR・テスト・変異や残る境界判断を追加しない配置変更と判断する。
