  reason: 'REQ-config-040 は、[local] の相対の root_dir を、その root_dir を書いた設定ファイルのディレクトリを基準に解決すると定める。 そのディレクトリは OS に解決させた設定ファイルの絶対パスの親とし、解決できなければ "Failed to resolve the directory of config file: 絶対パス" で終了コード 2 にし、"~/" を展開した後に絶対パスなら求めない。 resolve_local_root はこのとおり、expand_tilde（REQ-config-010）の後に絶対パスならそのまま返し、相対のときだけ canonicalize した設定ファイルの親につないで "." の要素を除く（A65・A66）。 config_path は設定ファイルを読んだときにその [local] に覚えるので、グローバルとプロジェクトの設定はそれぞれ自分のディレクトリを基準にする。 空の root_dir は基準につなぐ前に REQ-config-041 の "root_dir must not be empty" の ConfigValidation で止める。 --config の存在と通常ファイルの確かめと読み込みは書かれた形のパスで OS に渡し、文言には作業ディレクトリにつないだ絶対パスを示す（REQ-config-006・REQ-config-007、A64）。 ローカルの書き込み先の識別は解決した root_dir で決まり（REQ-backup-021）、REQ-backup-043 の以前の識別は、書いたままの root_dir を設定読み込み時の作業ディレクトリにつないだもののうち、字面で正規化して今の識別と同じになるものだけを探す（A57・A58）。 一覧・書き戻しは、セッションごとに最初に記録があるキーを同じ規則で選び、期限切れの整理の対象にも加える。 テストの期待を要件と照らした：EX-config-016 は別のディレクトリからの --config でプロジェクトのディレクトリの中身が一覧に出ること、グローバルの設定の相対の root_dir はその横のディレクトリになること、REQ-config-041 は理由の文言で止まることを確かめる。 実パスに直せない相対の --config は絶対パスを示して止まること、作業ディレクトリが 4096 バイトより深くても絶対パスの root_dir なら終了コード 0 で動くことも確かめる。 EX-backup-024 は、以前の版が設定ファイルのあるディレクトリを作業ディレクトリにして保存したセッションが同じ条件で一覧に出て書き戻せることを確かめ、A58 の取り違えがないことも確かめている。 backup_sessions.rs の既存テストを起動したディレクトリによらない形に改めたのは、REQ-config-040 と REQ-backup-021 で書き込み先が設定ファイルの場所で決まるようになったためで、要件の変更ではない。'
