        sha256: sha256:374a23e7e9863821c0becbac5a9b8bcbc9cecdff29380177c608e46f82c17ae1
    conclusion: existing
    reason: >-
      REQ-merge-001は種類の違う既存の書き込み先を変更せず理由付きでスキップすることを求め、
      EX-merge-001はリンクとリンク先が変わらないことを求める。execute_mergeの計画分岐で
      SkipDifferentKindだけが戻らずにテキスト書き込みへ進んでいた。追加のreturnで、
      確認ダイアログのyとmtime警告からの強制マージの両呼び出し元とも、バックアップ予約と
      書き込みの前に止まる。他の計画分岐と通常テキストマージの処理は変わらない。
      追加テストを修正前のコードに当てると両方向でリンク先が元の中身に上書きされて失敗し、
      修正後は成功することを別作業ツリーで実測した。要求・IR・決定は変えず既存要求の範囲に収まる。
      hunkマージと変更書き込みの経路は今回の対象外で未確認。
    requirements:
      - REQ-merge-001
