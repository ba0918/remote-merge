    reason: 固定した比較元と対象の全差分、承認範囲と参照された実出力を独立に照合した。四ファイルは旧namespaceの正確なtarget引数30個だけを除くと元の全bytesとmodeに一致し、全テスト本文・cfg・期待値とexec_strictのpub(crate)署名・本文も同一である。全3109件の収集結果はclient26・known_hosts18・known_hosts_io1・preferred7件のownerとssh接頭辞だけを対応付けて一致し、残る3057件は無変換で一致する。候補SSH132件全てに実際のPASS行がある。root委譲関数は同じ可変借用とcommandを既存methodへawaitするだけで、製品はpub(crate)再公開に限定する。runtime二ファイルは三呼び出しと必要な整形だけを戻すと全bytesが一致し、sudo・配布後処理・パス検査の入力と失敗処理を維持する。旧製品clientの型と公開methodは同じ型の再公開で保たれ、consumerの成功と非実行のasync署名照合からsettings型・core Result・russh Channelの同一性を確認した。feature転送を有効にした確認は成功し、無効時E0599、private methodのE0624、製品bridgeと内部moduleのE0603は意図した外部拒否として通常検査から区別した。不要になったprivate宣言とhelper別名に残る利用者はなく、coreとsettingsおよびconfigの元項目をprivateに再利用する。全manifest・lock・metadataは既存指定の九依存辺とfeature転送だけを除き一致し、外部版・feature指定と六memberのrootは変わらない。認証・known_hosts・ゼロ化・終了status・リトライ・チャネル解放・パスescapeと既存パースやサポートは変更しない。30ログはtarget・level・message・field・引数を静的に照合しただけで、動的イベントやfile・line・module_pathの維持、macOS成功を主張しない。前後と最終の通常検査、Linux install・表示・musl・Docker・coverageの実出力を確認し、初回fmt失敗と採取exitのないlock比較失敗は修正後の成功と区別した。全追加行のcredential・個人環境path・秘密鍵scanには該当がない。PROJECTと決定はA1と具体設計D1〜D5の閉じた所属変更に一致し、新IR・テスト・変異や次の境界判断を追加しないと判断する。
