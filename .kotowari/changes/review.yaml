    reason: 固定した比較元から対象までの全差分、承認範囲と参照された実出力を独立に照合した。六つの配置実装は四つの必須版引数・元定数参照・転送引数と五つの旧target明示、test/helper配置および元の一個の区切り改行だけを戻すと元の全bytesに一致し、Git modeも同じである。sudoは全blob同一、resolveの全テストと下位root二件は元本文のままである。全3109件の収集結果はresolve22・sudo10・root2件のpackageとlib binary ownerだけを対応付けて一致し、名前・接頭辞・属性と他3075件は無変換で一致する。製品に残るtransfer40・verify27・remote_target21件の全test moduleは無変換で一致し、122配置テストの各本文を正しいownerに一度だけ保つ。移動34件と残る88件全てに実際のPASS行がある。製品公開root項目集合を元宣言と照合し、型・enum・定数・Defaultは下位の同じ項目を再公開する。四つの製品wrapperは元signatureと引数を保ち製品CLI_VERSIONを渡すだけで、uname parserの旧rootとremote_targetパスは同じ製品wrapperを使う。private resolveとresolver helperは公開しない。test-only SHA helperのdoc・cfg・本文は製品だけに同一のまま残り、SHA importだけがtest cfgになる。元CARGO_PKG_VERSIONを使うテストは製品0.2.13に留まり、protocol.rsと版macroの正本を変えない。Agent build.rsは変更のない製品scriptと全bytes同一で、current_targetのenv!(TARGET)本文も同じである。hostとmuslの実consumer出力は旧二パスと下位の型・四signature・版判定・script bytes・Default・TARGETの一致を示す。基準TARGETは元sourceとbuild scriptを複製した隔離packageでのproducer再現であり元の全CLI再実行とは区別する。三つの外部private/helper参照は意図したCargo 101のE0603とE0425として通常検査から区別した。全parsed lockはAgentのdirs辺だけを除き同一で、manifestは元SSH pathのdevから通常への移動と既存dirs 6だけを除き同一、metadataもその二辺とcustom-build targetだけを除き元package記録と一致する。依存版・featureとroot/app manifestは変更しない。元shell escape、入力検証、エラー連鎖、atomic移動・失敗時処理と直接runtime callerは変わらない。前後の通常検査は2999件、全featureと最終検査は3109件の実成功を確認し、Linux install・musl・Docker・coverageと同一version/help表示も実出力を確認した。初回fmt失敗と採取exitのないcomparator二失敗を成功と扱わない。五ログは静的照合のみで動的captureとmacOSは未検証、file・line・module_pathの維持も主張しない。全追加行の秘密鍵・credential scanは該当なくhome pathは元からの架空fixtureのみである。PROJECTと決定A1・D1〜D5はこの閉じた所属変更を説明し、新IR・要件・policy test・必須変異検査と次の抽出を追加しないと判断する。
