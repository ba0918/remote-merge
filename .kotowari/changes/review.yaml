    reason: >-
      固定baseから対象までの全code・document差分と参照された実出力を独立に照合した。
      共有Sideとserviceの五ファイルは全bytes・Git modeが元の六ファイルと無変換で一致し、private helpers・公開項目・inherent methods・serde属性・test本文と期待値を変えない。
      製品の六facadeは各canonical moduleのglob再公開一行だけで、appとserviceのmodule宣言と消費側は不変である。
      Sideのinherent実装はengineのside一か所にありstdだけを使い、engineにapp namespaceや上向き依存を足さない。
      DTOのConflictRegionと算法のdiff・treeは既存core別名に解決され、外部private helper橋渡しやrestricted visibility変更を必要としない。
      全3109件の実収集データと属性は152ownerとSide15件の接頭辞だけを対応させて一致する。
      内訳はSide15・types30・max_files10・path_resolver39・fast_path27・diff31で、残る137移動名と他2957identityは不変、製品lib1543・engine233である。
      移動152件の実PASSを確認し、狭い2917件は収集証拠だけで追加実行とは扱わない。
      実consumerのcompile・runは旧appの両Sideパス、全33DTO、算法の公開型、core ConflictRegionとDTO fieldのnominal同一性および列挙された旧関数署名を確認する。
      既存StatusOutput fixtureの省略filesとmodified数のassertionを実serdeで確認し旧新JSONが一致する。残るserde表現は無変更の本文と既存30typesテストで確認し、新JSON規約を作らない。
      全parsed manifest・lockはengineのserde通常依存とserde_json dev依存の二辺だけを除くと一致し、metadata全体も同じ二宣言だけを除いて一致する。
      元製品のderive feature・版指定を採用し、既存外部checksum・版・feature・他package辺、八member・製品0.2.13・protocol v4と変異mappingを変えない。
      全差分のcredential・home path一致は元の架空fixtureだけで秘密鍵・unsafe・process起動の追加はなく、直接CLI callerのpath検証と機密maskの利用は同じ実装を通る。
      保存されたcommandとexitを照合し、前後の通常2999件と全feature3109件、Clippy、Linux install・musl・Dockerと同一version/help表示の実成功を確認した。
      Coverage TOTALはregion81377・未到達7685、function4674・未到達294、line49192・未到達4758で前後一致するが全出力bytesやper-file一致とは扱わない。
      最終通常nextestのexit100は2232成功・一件失敗・876未実行であり、変更のないPTY testがq送信後500msで生存していた失敗を残す。
      exact testのj1は一件成功・五件skip、j2全suiteと後続の通常設定二commit hookは3109成功である。さらに親の通常nextest実出力も3109成功・skipなしと確認したが以前の失敗を消さない。
      並行度によるscheduling感度は仮説だけで原因証明やbug修復ではなく、成功のためのsource/test変更もない。
      六移動sourceにログsiteはなく動的captureは行っていない。source-location metadataの同一性とmacOSの成功は未検証である。
      PROJECTと決定A1・D1〜D5は閉じた共有型と純粋算法の所属変更に対応し、実行処理・I/O・残るengine抽出・IR・policy test・新oracleを追加しないと判断する。
