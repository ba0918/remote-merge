  reason: 承認された配置変更として旧パスの削除と新パスの追加を両方照合した。Git の blob とモードを独立に比較し、製品コードと既存テストは保存先の補正一か所以外同一である。manifest の依存・features・ターゲット指定と
    release profile は維持され、唯一の member と default-member、ルートの target、独立した Docker E2E、ルートの失敗入力保存先が決定に一致する。比較資料の元出力からテスト名と無視状態、インストール後の表示、限定した変異の実行結果も確認した。crate
    抽出や製品の振る舞い変更、新しいテスト・要件・開発方針 IR は含まれない。
