    reason: 固定した比較元と対象の全差分を独立に照合した。hintは全blobとmodeが一致し、他二ファイルも承認済み四つの正確なtarget引数だけを除くと全bytesが一致する。全テスト本文・cfg・期待値・環境変数名を保ち、29件の所属とssh接頭辞だけが変わり、残る3080件の名前・所属・属性は一致する。候補SSHライブラリ80件の成功出力も確認した。製品の三つの公開再公開とSSH側のprivateなsettings別名は同じtrait・型を使い、公開パス間のtrait objectとUnknownHostInfo、設定policyの代入は実測で成立する。既存ホストキーポリシー・CLI/TUI判定・パスフレーズのゼロ化・空値処理・取得順序とリトライ上限、ヒント本文は維持され、clientを含む利用側は変更されていない。ホストキー三ログは元namespaceと固定比較元の本文を使うローカルmacro producerと実際の候補依存でtarget・level・messageが一致した。比較元製品CLIのイベント採取ではなく、端末エラーdebugは静的な引数照合だけで動的成功を主張しない。file・line・module_pathの維持も主張しない。全lock・manifest・metadataはSSHへ加わった既存指定の四依存辺だけを除き一致し、外部依存・feature・版は変わらない。通常検査・最終全テストと前後のインストール・表示・musl・Docker・coverageの実出力を確認した。macOSと未実行の変異を成功とは扱わない。配置説明と決定記録はA1〜A3を具体化する範囲内であり、新IR・テストや残る認証helper・SSH境界の判断を含まない移動と判断する。
