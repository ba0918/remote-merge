  reason: "ローカルと Agent の symlink の作成から作成先の既存の項目を消す処理を除き、作成先に通常ファイル・ディレクトリ・symlink があれば置き換えずに失敗する（A7、REQ-merge-040）。merge_flow は比べたときにあった書き込み先（target_exists）を先に消してから作り、rollback は symlink の復元を飛ばすので、REQ-merge-003 の更新は変わらない。merge.rs の変更はコメントだけである。これは harden-security の A6 の「symlink の作り直しはリンクそのものを消して作る」を利用者の判断 H3 で置き換えたもので、harden-security の決定記録の改訂にも書かれている。単体テストは三つの経路で既存の項目が変わらないことを確かめる。"
