    sha256: sha256:5073bd1d4e25e54099bae6c32490a0639ab5db0909f8c19beb4cbcf3c077e986
  conclusion: new
  reason: 版の確認より前に、配置先を一つの POSIX sh の検査で確かめる。配置先がなければ途中の親も含めて umask 077 で作り（A10・A11、REQ-ssh-015）、配置先が symlink か所有者がセッションの id -u（sudo=true では 0）でなければ何も実行しない（A11、REQ-ssh-014）。書かれたパス・途中の各リンクのリンク先・解決した実際のパスの各段について、所有者が root か期待する uid であり、sticky bit なしにグループかその他が書き込めないことを確かめる（A13、REQ-ssh-017）。自分の配置先がグループかその他に書き込めるだけで辿るディレクトリが安全なら、モード 700 に直して中の Agent と書き込み途中のファイルを実行せずに除き、版の確認を省いて置き直し、パスを示す警告を出す（A11、REQ-ssh-018）。sudo=false で使わないときはパスを示す警告を出して SSH の経路で続け（A14、REQ-ssh-019・REQ-ssh-005）、sudo=true では止まる（REQ-ssh-009）。警告とエラーの文言は、検査に当たった場合と検査を終えられなかった場合を区別できないことを踏まえて「安全と確かめられない」と述べ、A11 と A13 の条件を正しく示し、秘密を含まない。版が一致してもローカルのバイナリと SHA-256 が違えば置き直し、リモートで計算できなければ警告して実行する（A8、REQ-ssh-016）。sudo=true では版の確認・ハッシュ・書き込みと照合も sudo で行う（A12）。安全の制約を IR に書くことは A31 と食い違うため A7 で範囲を絞った。A1〜A14 はすべて利用者の判断として記録されており、委任の範囲を越えた意味の選択はない。印の付いた契約テストと Docker の試験は各要件の禁止と結果を確かめ、要件と一致する。REQ-ssh-016 の警告と REQ-ssh-015 の途中の親のモードは印のない単体テストだけが確かめる。
