    reason: 固定した比較元と対象の全差分を独立に照合した。移動した二つの全本文は承認済み三つのwarn target行だけを除くと一致し、Git mode・既存テスト本文・cfg・期待値も維持される。全3109テストの所属・名前・属性を比較し、tree_parserの23件とbatch_readの28件だけが所属と接頭辞を変え、残る3058件は一致する。移動した51件の実際の成功出力も確認した。製品のbatch_read公開再公開とtree_parserのpub(crate)再公開、coreの同じ型を使うprivate aliasは承認済みの範囲を保ち、利用側は変更されていない。公開パスとcore型の代入は実測で成立し、旧製品parserへの外部アクセスはE0603で拒否される。元のnamespaceで固定比較元の二ファイルを再現したローカルmacro producerと候補依存の実行では、既存EnvFilterによる三つのtarget・WARN・messageが一致した。これは製品CLIの比較元イベント採取ではなく、定義元のfile・line・module_pathの維持も主張しない。全lockレコード・既存manifest・metadataは新しいローカルpackageと依存辺を除き一致し、新crateは内部版0.1.0・edition 2021・publish=falseで通常検査へ参加する。前後のインストール・版とヘルプ・musl・Docker・coverageと最終全テストの実出力を確認した。macOSや未実行の変異の成功は主張しない。配置説明と決定記録もA1〜A3を具体化する範囲内であり、新IR・テスト・認証変更や残るSSH境界の判断を含まない抽出と判断する。
