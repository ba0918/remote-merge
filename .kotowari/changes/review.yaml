  reason: "wrap_for_login_shell はスクリプトを sh -c の単一引用符の引数にし、単一引用符とバックスラッシュを引用符の外でバックスラッシュを前に置いて出すので、REQ-ssh-020 の文の包み方と一致し、fish が単一引用符の中で解釈する \\' と \\\\ も残らない。単体テストは包んだコマンドを sh・bash・dash・fish で実行して sh の結果と比べ、契約テスト a_merge_with_writes_links_and_deletions_works_when_the_remote_login_shell_is_fish（印 REQ-ssh-020・EX-ssh-033）はテスト用サーバのログインシェルを fish にして書き込み・symlink の作成・削除を含む merge が成功することを確かめ、例の期待と合う。テスト用サーバは引用を外したスクリプトで振る舞いを決め、受け取ったままのコマンドをログインシェルで実行する。CI は fish を入れて REMOTE_MERGE_TEST_REQUIRE_FISH を置き、fish がなければ飛ばさずに失敗する（A12）。保証の範囲は Bourne 系と fish に限り、csh と tcsh は保証しない（A13）。どれも利用者の判断 H1・J2・J3 の範囲にある。"
