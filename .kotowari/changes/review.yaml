    reason: 固定した比較元と対象の全差分を独立に照合した。framing全137行は7単体テストを含めてGit blobとmodeが一致し、16 MBの上限、長さの通信形式、IOエラーの種類と伝播を変更していない。既存protocol crateの公開モジュール宣言と製品側の同名再公開だけで旧公開パスを維持し、client/serverの本文とsuper::framingのimportも一致する。全3109テストの名前・所属・属性を比較し、7件の所属と接頭辞だけが変わり、残る3102件は一致する。全manifest・lock・metadataと製品版表示は同一で、新しい依存・crate・IR・テストはない。保存された前後の通常検査と最終全テストの成功出力を確認した。追加した配置説明と決定記録はA1・A2の移動範囲を具体化している。任意のwrite_frame変異は実測でタイムアウトし、caughtとは扱わない。D4は呼出元が追加した必須条件の撤回であり、利用者の製品合意の変更ではない。候補側の変異は実行されておらず、過去の配布検査を今回の成功とは数えない。これらの根拠から承認済みの配置変更の範囲内と判断する。
