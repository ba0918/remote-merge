    reason: |
      実装と別のレビューとして、比較元 a7fd6df から f79f5f1 までの差分全体を判断の記録 2026-10-05-ssh-directory-read と IR に照らして確かめた。
      SSH の一件ずつの読み込みに "test ! -d" を足してディレクトリを失敗させる変更は、記録の Context が述べる不具合（openssl がディレクトリを終了コード 0 で空として返す）の修正で、ローカルとエージェントの振る舞いにそろえるものである。この読み込みは diff 以外（merge・sync など）の SSH の読み込みにも効くが、ディレクトリを空のファイルとして読まないという方向にだけ変わる。
      diff が使う SSH の子の一覧を find の終了コードを見る list_dir_strict に変えた点は、fetch_children の呼び出し元が製品コードでは diff だけであること、エージェントの経路も子の一覧は同じ SSH の find を通ることを確かめた。
      ローカルの子の一覧を root_dir の内側の検査（字句上の検査で symlink は解決しない）に通す変更は、入力パスの親ディレクトリへの遡りを禁じる REQ-cli-026 の範囲にとどまる。
      左右とも子の一覧が取れて空のディレクトリを差分なしとする判定は REQ-cli-025・REQ-cli-052 と、利用者の決定 A1 による REQ-cli-077（左右の両方にある場合に限る）に沿い、片側だけの場合は FLAG-cli-073 に残して振る舞いを選んでいない。ルートの指定と glob をこの判定から外している点も REQ-cli-052 と矛盾しない。
      ディレクトリでないと分かっている側にだけ子をないものとする展開は A2（REQ-cli-021、FLAG-cli-045 を閉じる）、参照先のない symlink の側をエラーにしつつ読めた側の子の差分を残す変更は A3 と REQ-cli-022（FLAG-cli-044 を閉じる）に沿う。A4 は FLAG-cli-033 を A1 で閉じ、A5 は子がすべて exclude に当たるディレクトリの観察を利用者の決定で未決の FLAG-cli-031 に加えた。
      要件 ID の付いた追加テスト 6 件の期待値を各要件と突き合わせ、矛盾はなかった。新しいテストと client.rs の単体テストを実行し通ることを確かめた。
