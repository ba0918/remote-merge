    reason: 固定した比較元から対象までの全差分と参照された実出力を独立に照合した。七ファイルの全bytesとmodeは旧targetの明示引数33個だけを取り除くと一致し、clientとtestsは無変換で一致する。32イベントとserverのDEBUG enabled guard一個は旧targetを保つ。全3109件の収集結果はclient21・server14・dispatch33・file_io36・tree_scan32・ssh_transport12・tests9件のpackageとlib binary ownerだけを対応付けて一致し、nested agentの名前・接頭辞・属性と残る2952件は変更がない。移動した157件全てに実際のPASS行がある。製品の公開module再公開と新nested moduleを元の宣言と照合し、Unixのproduction gateとtest gate、private run_agent_loopおよびtest moduleを維持している。rootはcoreのfilterとtreeをprivateに使い、SSH別名はtest cfgだけで既存parser参照を解決する。consumerの型と関数署名の照合は成功し、private loopとtest-only moduleの外部参照は意図したCargo 101として通常検査から区別した。製品protocol.rsとCLI_VERSION、deploy、build.rsのTARGET、mainとruntimeは不変で、新ownerは下位protocolとframingの同じ項目を使い内部版をhandshakeに流さない。全manifestとparsed lockは七番目のmemberとdefault-member、新内部packageおよび製品のpath辺だけを除いて一致し、既存metadataの全package記録も新辺を除いて一致する。通常依存はcore・protocolと既存anyhow・chrono・sha2・tracing・russh・tokio・libcの指定を複製し、dev依存はSSHとtempfileだけで、外部版とfeatureに変更はない。パス検証・書き込みmetadata・symlink走査・フレーム制限・終了処理とチャネル所有は元本文および変更のない直接callerのままである。前後と最終の通常検査、Linux install・musl・Docker・coverageの実出力と同一のversion・help表示を確認した。初回fmtとconsumerの接頭辞誤認による失敗は成功として扱わず、修正後の記録と区別した。ログは33箇所の静的照合のみで動的captureとmacOSは未検証である。既存clientテストのUnix参照はそのままで新しい移植性を主張しない。全追加行のcredential・個人環境path・秘密鍵scanに該当はない。PROJECTと決定のA1・D1〜D5はこの閉じた所属変更を説明し、新IR・要件・テスト・必須変異検査や次の抽出は追加しないと判断する。
