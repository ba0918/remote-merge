    reason: >-
      固定baseから対象までの全code・document差分と参照された実出力を独立に照合した。
      元の462行の全blobと100644 modeは、二import・三型と八methodの十一可視性・Side import移動・constructor signature一行化だけを個別に戻すと一致する。
      private fields・保存enum・helpers・serde tag/default/省略・error chain・content先行write・rename/cleanup・PID/Relaxed atomic・予約collision・retention・SHA・Unix権限と不完全entry拒否はこの全文一致で維持される。
      製品facadeは三型のpub(crate)再公開一行だけで、runtimeのprivate module宣言と全callerは不変、同じSide・AppConfig・backup/DTOを使い型やvalidatorを複製しない。
      全3109test identityとmetadataはowner・binary・名前・接頭辞を含め無変換で一致し、製品lib1418・engine358を保つ。runtime core51件とside_io116件は実final PASSに対応し、226行のbackup境界証拠も実runと一致する。
      狭い2917件は既存の収集結果だけで追加実行成功とは扱わない。保存moduleにtestやログ・env/include macroを足さない。
      full baseline moduleと固定base元sourceは全bytes一致しSHAも確認した。rootに製品app/config/backup/serviceを別名参照して再現した旧保存関数producerであり、旧CLI全体の再実行ではない。
      probeの実compile・runとsourceを照合し、自分の一時fixtureだけで同じ入力pathと注入時刻を旧新へ渡し、永続relative path・全file bytes・Unix mode・DTO JSON・十二予約ID・一覧順序・file/symlink readback・local/remote識別とlogin独立性・finish/retention結果を比較する。
      八公開methodのfunction pointerは実config・Side・DTO型でcompileされる。probeのmode期待値は既存所有者専用契約に対応し、新保存形式・恒久layout/policy testを作らない。実利用者backupへアクセスした証拠とは扱わない。
      製品private module、下位StoredBackupRecordとtarget_descriptionへの三probeは各Cargo101・E0603の意図した拒否として通常成功検査から区別する。
      全parsed manifestは既存sha2 0.10通常依存と同版serde_json 1.0.149のdevから通常への移動だけを除いて一致する。
      全lockは製品にもあるqualified sha2 0.10.9一辺だけを除いて一致し、JSON kindはlockに含まれないため実metadataで別に確認した。metadata全体もこの二差だけを戻すと一致する。
      外部版・checksum・既存feature・他package辺と八member・製品0.2.13・protocol v4を変えず、private config別名も広げない。
      変異一覧はstorage entryのfile値一か所だけを変更し、text/change/class/rationaleと他entryは全bytes不変である。同等性の新判断や変異実行ではない。
      初回提案fmtのexit1で示された二追加format変更はD3の明示承認範囲と一致し、停止reportと初回出力を残す。patch context拒否にrunner exitを捏造せず、qualified SHA edgeのcomparator誤仮定のexit1も成功とは扱わない。
      保存されたbaselineとcandidate command/exit、前後の通常2999件・全feature3109件、Clippy、Linux install・musl・Docker六件と二件、同一version/help bytesを確認した。
      修正comparison後の全final Cargo tests・通常nextestと二commit hookは3109成功・skipなしであり、以前のPTY原因を証明したことやtest/runtime修復とは扱わない。
      Coverageはregion81395・未到達7685とfunction4676・未到達294を保つがline49220から49216へ変わり、未到達4758と丸め率だけが同じで全count/bytes一致ではない。
      全追加行にcredential・account path・秘密鍵・unsafeはなく、process参照一件は元のPID取得そのままである。直接runtime保存・復元callerと関連契約は同じcanonical安全判断を通る。
      macOS・nonUnix実行・動的loggingとsource-location metadata同一性は未検証である。PROJECTと決定A1・D1〜D5はこの閉じた保存owner変更に対応し、新IR・policy test・他I/Oや残る抽出を加えないと判断する。
