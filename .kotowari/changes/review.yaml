  conclusion: existing
  reason: 'REQ-cli-078 と REQ-merge-007 は、diff・merge・sync のパスの引数に絶対パスか ".." の要素があれば、経路によらず走査・読み込み・書き込みの前にコマンド全体を "absolute subpath not allowed: パス" か "path traversal not allowed: パス" で止め終了コード 2 を返すと定めている。 check_path_arguments は diff の execute_diff の先頭（走査の方式を選ぶ前）と merge・sync の引数の検証で呼ばれ、接続・バックアップの整理より前に止まる。 REQ-cli-052 の root_dir 全体を指す値（"/"・"."・"./"・空）は has_root_marker と同じ判定で飛ばし、それ以外は入力されたままの値で check_rel_path に渡すので、文言に出るパスは利用者が打った値そのものである。 "//" も root_dir 全体として受け付けるが、末尾の "/" を除くと空になる値で "/" と同じ意味であり、REQ-cli-052 の範囲に収まる。 経路ごとの境界（validate_remote_path、SSH の子の一覧）を同じ check_rel_path に置き換えたのは path-validation の A4 のとおりで、新しい分岐は作っていない。 先頭の "/" を削って受け付けていた読み替えが拒否に変わり、".." の文言も引数と同じになったが、引数の検査の後に利用者の入力はここに届かない多層の防御である。 テストの期待は要件と合う：EX-cli-069 は比較の結果を出さずに文言と終了コード 2、EX-merge-013・EX-merge-014・EX-merge-040 は文言の全体と書き込み先の中身が変わらないこと、 エージェントを有効にした経路では試験サーバにコマンドが一つも届かないこと、sync は二つの書き込み先のどちらも変わらないことを確かめている。 diff.rs と merge_paths.rs はパスの辿り方の組の変更（REQ-paths-011 の not a directory、REQ-cli-026 の root の外かの判定で確認のエラーをパスごとのエラーにする）と共有するので、その要件と IR もこの組に含めた。 確認のエラーを root の外でないと読んでいた握りつぶしを直したもので、辿れないリンクの中身を比べない側に倒れ、REQ-cli-026 の外へ広げてはいない。'
