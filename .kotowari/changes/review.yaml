  reason: REQ-paths-001〜007 の辿り方を core の resolve_path 一つに置き、基本操作（lstat の種類・readlink・検索権限）を PathOps で受け取る形は A1・A22・A40 のとおりである。 手順を IR と照らした：root_dir と相対パスをつないで "/" から辿り、空の要素と "." を捨て、リンク先の ".." は辿り終えた実ディレクトリの親へ移る。 一つの要素で名前の長さ（255 バイト超）、つないだ長さ（4096 バイト以上）、検索権限、種類の順に確かめる（A33）。 リンク文字列の差し込みは root_dir と末尾のリンクを含めて数え、41 回目で止める（A31）。存在しない部分の ".." は parent reference in missing part、後ろに要素が残る途中のリンク先が存在しなければ dangling symbolic link にする。 ディレクトリでない要素は、辿っている途中のリンク先が残っていれば not a directory、残っていなければ元の要素が相対パスのものなら途中の祖先がディレクトリでないという結果、root_dir のものなら not a directory にする（A27・A29）。 末尾の "/" は確認全体の最後の要素にだけディレクトリを求める（A26）。どれも IR の文と例に合う。 原因の文言は ResolveError の閉じた一覧で、エージェントと SSH の答えも一覧にない文言をエラーにする（A35・A44）。 ローカルとエージェントは同じ OsPathOps を使う。検索権限は Unix では faccessat の AT_EACCESS、Unix 以外では OS の権限のエラーだけを permission denied にする（A46・A54）。 SSH のスクリプトは同じ状態を sh で持ち、検索権限を cd で判定し、LC_ALL=C を代入し、出力を NUL で区切ったバイト列で読む（A48〜A50・A55）。 実装を読んで、途中の祖先の判定でリンク先の最初の要素だけを見る点（差し込んだときの残りの数は小さくならない）、相対パスの要素かの判定、存在しない部分の扱いが core と同じであることを確かめた。 経路の一致は path_routes_agree の例の表と proptest で比べている（REQ-paths-008、EX-paths-019）。 通信の版を 5 に上げ、5 未満なら SSH に回し、sudo のサーバでは置き直しを求めるエラーにする純粋関数 path_route は REQ-paths-010（EX-paths-021・EX-paths-024）に合う。 接続のロックが壊れているときに SSH へ回さずエラーにするのも A45 の安全側である。 リモートの相対の root_dir は、エージェントが getcwd、SSH が pwd -P の結果につなぐ（REQ-paths-012、A53）。ローカルの確認は絶対パスの root_dir だけを受け取り、相対は設定の読み込みで絶対パスにする（local-root-from-config-file の組）。 rollback は current_restore_path で結果を読む。途中の祖先が通常ファイル（通常ファイルを指す symlink を含む）ならスキップ、それ以外のディレクトリでない祖先はエラーにする。 これは REQ-backup-031 と path-validation の A2 のとおりで、祖先を別に問い合わせる処理を消したのは A7 による。 rollback 以外は CoreRuntime の inspect_path の一か所で not a directory のエラーに読み替える（REQ-paths-011、A16）。 契約テストの期待を IR と照らした：path_resolution.rs の EX-paths-001〜018・023 は例の Then と同じ種類・実パス・文言を確かめている。 EX-paths-015 は root で実行したときだけ確かめを飛ばす（A34 の前提）。EX-paths-022 と REQ-paths-011 の diff のテストは not a directory、EX-backup-027・029・030 は三つの経路でスキップと書き戻し先が変わらないこと、REQ-backup-003 は接頭辞を一度だけ付けた原因を確かめている。 普通のパスで新しい実パスが canonicalize と同じバイト列になることは local_io の単体テストで確かめている（A13）。 試験 SSH サーバとエージェントの経路の前提の確認は、test-utils で公開した製品のコマンドの先頭の並びを読んで、確認のコマンドを見分ける。 target_io.rs・side_io.rs・contract.rs・diff.rs・merge_paths.rs は引数の検査の組と共有する。
