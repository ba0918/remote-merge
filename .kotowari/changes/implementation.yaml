    reason: >-
      承認された三sourceの所属変更だけを固定base全体で照合する。
      要求全体のfailureと二理由のskip展開、および保存レコードの変換matchを維持し、
      Option結果の外側と既存型のpath、検査エラーのDisplay文字列化だけを境界に合わせる。
      第一passの逐次readとplain Symlinkの検査省略、即時return、第二passのreadと全I/O順序を保つ。
      全sourceの再構成比較、全3111件のidentityとmetadataの一致、retryなしの実測pass、
      公開型と旧signatureのcompile probe、依存metadataと配布経路の検査で確認した。
      既存116 SideIOテストを含む全テスト本文・期待値・mark、依存・feature・版・IRを変えない。
      既存SkipDifferentKindのcaller不具合を修正せず、製品全体の適合や独立承認を宣言しない。
