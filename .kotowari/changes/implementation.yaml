- id: ssh-batch-read-format
  base: 668161dd20f9a29f547c4829ec4becc78fa521c5
  role: implementer
  files:
  - path: crates/remote-merge-ssh/src/batch_read.rs
    before: sha256:b0703a22ae6d716c8b8ca7810ca29c6797aa046403baa49b30817812a9c07b5c
    after: sha256:342cee6af0895d6cdd1d897d3b7b63e1c78146aa2410908b3c1553efca684bf4
  ir:
  - path: docs/ir/merge/read-failure.md
    sha256: sha256:dd9debd1e232ac7f42c1abad4f0e1c8402cd0910e814f4b46f12372b36d12714
  conclusion: existing
  reason: "SSH の一括読み込みの形式を、各ファイルの読めたかどうかとバイト数を出す形式に替え、通常ファイルでないか読めなかったパスを結果から外す。結果にないパスは呼び出し元が一件ずつの厳密な読み込みでやり直し、merge と sync は REQ-merge-017 のとおり空の中身とみなさずに失敗を報告し、REQ-merge-019 の \"read failed: right: 原因\" を出す。件数・バイト数・印が合わない出力は呼び出し全体を失敗にする。出力の区切りの形を固定していた単体テストは、仕様が契約にしていない形なので除いた。新しい文言は決めていない。"
  requirements:
  - REQ-merge-017
  - REQ-merge-019
  decisions: []
  handoff: null
  gaps: []
