  conclusion: new
  reason: "終了ステータスなしで終わったバイト列の実行を接続エラーにし、途中で切れた一括読み込みを REQ-ssh-003 の再接続と再試行の対象にする。走査の起点の確認は終了コード 1 だけを REQ-scan-015 の \"Remote root_dir not found\" にする。リモートの削除と symlink の作成は終了コードを検査する実行に替え、REQ-merge-034 の削除の失敗と REQ-merge-023 の symlink の作成（親ディレクトリを先に作る）を報告する。要件の文が直接決めていなかった扱いは判断の記録に残し、REQ-merge-038〜041 と REQ-ssh-020 として IR に書いた（A6）: 最後の要素が symlink のパスへ書かない（A1、REQ-merge-038）、symlink の作成先に何かあれば置き換えず、リンク先の前に -- を置く（A7・A10、REQ-merge-040、EX-merge-049）、削除は -f のない rm でないパスを失敗にする（A4・A9、REQ-merge-041）。A2 は A7 に置き換えた。SSH の書き込みは、A8 の一時ファイルの付け替えを A11 で置き換え、dd の oflag=nofollow で書き込み先をその場で開いて切り詰めて書く（REQ-merge-039、EX-merge-046・EX-merge-050）。書き込み先のファイルそのものに書くので REQ-merge-013 と REQ-backup-029 の所有者と権限の維持に合い、ハードリンクも保つ。書き込み先を開く前に cat / openssl があることを確かめ、見つからないときは書き込み先を開かずに失敗し書き込み先を変えない（main の openssl の -out と同じく、デコーダーがなければ書き込み先は変わらない）。この扱いは A11 を補う改訂として決定記録に残し、A6 のとおり REQ-merge-039 に書いて確かめ方にそのテストを足した。見つかったコマンドがオプションを受け付けずに失敗するときは切り詰めた後の失敗なので、REQ-merge-039 の途中までの中身が残る扱いに当たる。pipefail のない sh で cat / openssl と dd の両方の終了ステータスを確かめ（書き込み元の失敗を書き込みの失敗にすることは A11 のとおり REQ-merge-039 に書いた）、dd が oflag=nofollow を受け付けないときだけ symlink でないことを確かめてから書き（残る競合は REQ-merge-038 に書いた）、status=none は受け付けるときだけ付ける。sudo の書き込み（エージェントの配置）は変えていない。単体テストは生成したコマンドを sh -c に包んで sh・bash・dash・fish から実行し、symlink・ぶら下がった symlink・ディレクトリの書き込み先の失敗、権限・所有者・ハードリンクの維持と古い中身の切り詰め、他の項目が現れないこと、書き込み中の symlink への差し替え、nofollow のない dd と status=none のない dd、openssl のない PATH で書き込み先が変わらないこと（dd の nofollow の有無の両方）、少し書いてから失敗するデコーダーで書き込みが失敗することを確かめる。REQ-merge-038〜041 の確かめ方は実在する単体テストの場所と名前を指すように直した。単体テストはソースのファイルの中にあり、検査するテストファイルに足すと印のない既存のテスト 212 件が検査の失敗になるので verification は review のままにした（A14）。クライアントはすべてのコマンドを sh -c で送り（A5、REQ-ssh-020）、テスト用 SSH サーバは引用を外したスクリプトで振る舞いを決め、受け取ったコマンドを指定したログインシェルで実行する。決められていないコマンドの文字列を固定していたテストは除いた。書き込みの失敗の説明は、今は実行しないコマンドの形を示さない書き込みの説明に改めた（文言は決められていない）。"
