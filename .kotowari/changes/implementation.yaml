    sha256: sha256:8e904c682d2217b6d4a0f68cb8ca447806aae03f3186c1753c4c30ec768d3b52
  - path: docs/ir/ssh/sudo.md
    sha256: sha256:5073bd1d4e25e54099bae6c32490a0639ab5db0909f8c19beb4cbcf3c077e986
  conclusion: new
  reason: 版の確認より前に配置先のディレクトリを一つの POSIX sh のコマンドで検査する（sudo=true では検査全体を sudo で実行する）。なければ途中の親も含めて umask 077 で作り（A11・A10、REQ-ssh-015）、symlink であるとき、所有者が SSH のセッションの id -u（sudo=true では 0）でないときは中のものを何も実行せず、Agent を起動できない既存の経路に乗せる（A11、REQ-ssh-014。sudo=false では SSH の経路で続け REQ-ssh-005、sudo=true では止まる REQ-ssh-009 を変えない）。配置先へ辿るディレクトリは、書かれたパスの各段を根まで辿り、symlink に当たれば -f なしの readlink で読んだリンク先を同じく辿り（40 段で打ち切る）、解決した実際のパスも辿る。そのどれかがグループかその他が書き込めて sticky bit のないものか、所有者が root でも期待する uid でもないものなら、同じく何も実行しない（A9 を置き換えた A13、REQ-ssh-017。例 EX-ssh-027・EX-ssh-032 は試験用 SSH サーバ、別の利用者の持ち物の親の EX-ssh-031 は権限なしでは作れないので Docker の OpenSSH で確かめる）。sudo=false でこれらに当たって Agent を使わずに続けるときは、配置先のパスを示す警告を標準エラーに出す（A14、REQ-ssh-019。文言は契約にしない。sudo=true のエラーの文言は変えていない）。所有者が一致してグループかその他が書き込める配置先は、辿るディレクトリが安全ならモード 700 に直し、中の Agent と書き込み途中のファイルを除き、版の確認をせずに置き直して、配置先のパスを示す警告を出す（A11、REQ-ssh-018。試験用 SSH サーバは配置の前の確認に偽の失敗を返して置き直しを完了しないので、置き直されて中身が手元の Agent と同じになることは Docker の OpenSSH で確かめる）。版が一致したときもローカルの Agent のバイナリを解決できれば SHA-256 を照合し、不一致なら置き直す。リモートでハッシュを計算できないとき（__UNSUPPORTED__）と、ローカルのバイナリを解決できないときは照合せずに実行し、前者は警告する（A8、REQ-ssh-016）。sudo=true では版の確認・ハッシュ・symlink の確認・書き込み後の照合も sudo で行い、配置先のないサーバへの初めての配置が成功することを Docker の OpenSSH と sudo の試験で確かめる（A12、EX-ssh-029）。安全の制約を IR に書く範囲は A7 で決めた。新しい終了コードは契約にしていない。umask によってグループが書き込めるモードになる既存の試験の一時ディレクトリと配置先は所有者だけのモードを明示し、仕様にない Agent の起動コマンドの形を固定する検査は除いた。
