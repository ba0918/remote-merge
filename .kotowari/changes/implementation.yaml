    reason: >-
      別途承認済みのharness修正を含むmainを新しい比較元とし、四抽出sourceの承認済みbytesを維持する。
      十五本文と製品signature・dispatch・構築・no-op・private境界を変えず、
      承認された未使用private再公開の退役と五helperのtest-only化だけを維持する。
      四抽出sourceは元のレビュー済みHEAD、五harness sourceは新baseと正確に一致し、
      依存版/feature・IR・product policyを変えず旧3109 identityと承認済み二utilityテストの合成を検査する。
      旧baseの失敗と条件付きpassは履歴に残し、新baseで実装記録だけを結び直す。
      新しい振る舞い・制約・仕様gapや独立レビューの受け入れを本記録で宣言しない。
