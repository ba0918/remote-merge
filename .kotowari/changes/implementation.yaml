  ir:
  - path: docs/ir/merge/symlink.md
    sha256: sha256:e6960a904f30c4a8d1ffe77d7b3f30133d5f5a4727445e5ff12cf0030ae74bd0
  conclusion: existing
  reason: Agent の書き込みと symlink の作成だけ、親ディレクトリまでを今の検査と同じに root_dir の内側か確かめ、最後の要素を辿らないパスを使う。symlink の作り直しはリンクそのものを消して作り、リンク先を消さない（REQ-merge-003）。通常ファイルの書き込みは O_NOFOLLOW で開き、最後の要素が既存の symlink ならリンクもリンク先も変えずにエラーにする。リンクを通常ファイルに置き換えるのは REQ-merge-001 が禁じる種類の変更で、リンク先へ書くのは書き込み先の外を変えるため、要件の範囲で残る選択はエラーだけである（判断の記録 A6 に、製品側がこのエラーで Agent を使えないものとする既存の扱いの受け入れとあわせて残した）。書き込み後のモードと所有者は、パスではなく書き込みに使った開いたままのファイルに fchmod・fchown で設定し、書き込みの後にパスが symlink へ差し替えられてもリンク先のモードや所有者を変えない（リンク先を変えないという同じ要件の範囲）。読み込み・stat・ハッシュが使う validate_path と途中の symlink の扱いは変えていない。
  requirements:
  - REQ-merge-001
  - REQ-merge-003
  decisions: []
  handoff: null
  gaps: []
