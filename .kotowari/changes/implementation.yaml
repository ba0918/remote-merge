  conclusion: existing
  reason: "SSH の経路のパスの検査スクリプトをローカル（とエージェント）の検査と同じ規則に書き直し、lstat が ENOENT で失敗したときだけ missing（実パスは末尾の要素を含めない）にし、通常ファイルの下・検索権限のないディレクトリの中・自分を指す symlink・リンク切れやループする祖先の symlink の下はエラーにする。これで REQ-backup-003 のとおり、辿れないパスを含むセッションの rollback が SSH でも一件も書き戻さず全件を \"cannot resolve path: \" で報告し、REQ-backup-033 のリンク切れの末尾の symlink は今までどおり辿った先の場所で比べる。祖先のリンク切れの symlink を辿れないパスと読むことは決定記録 A1 に残した。REQ-backup-031 と EX-backup-027 のとおり、戻す先の検査が失敗し、すぐ上の親が symlink でない通常ファイルと分かったときだけ \"parent directory no longer exists\" でスキップする判定を engine の純粋関数に置き、親の種類をローカル・SSH・エージェントで調べる操作を TargetIo に足した（A2・A3）。エージェントの crate と通信の型は変えていない。target_io.rs の SSH の子の一覧の検査、side_io.rs のその単体テスト、scan_listing_cli.rs の AgentFixture の起動関数、contract.rs の mod 行は、REQ-cli-078 と REQ-merge-007 の変更と共有するファイルなのでこの組に含めた。"
