    conclusion: new
    reason: "SSH の一件ずつの読み込みを、openssl で読んだ後にディレクトリでないことを確かめる形にし、ディレクトリをローカルとエージェントと同じくエラーにした。diff はディレクトリを子の一覧の取得の成否で判定し、左右とも子のないディレクトリ（中身の空なもの、include の外のもの）を差分なしとする（REQ-cli-025・REQ-cli-052、include の外は利用者の決定 A1 による新しい REQ-cli-077）。この判定のため diff が使う SSH の子の一覧の取得を find の終了コードを見る形にし（ルートの一覧は変えない）、SSH の側だけ参照先がない symlink もエラー終了にした（REQ-cli-022、A3）。ローカルとエージェントのパスの検査は途中が通常ファイルのパスを SSH と同じくないものとして返し、通常ファイルと SSH のディレクトリ symlink の組でも配下を子パスで示す（REQ-cli-021、A2）。片側が参照先のない symlink、もう片側がディレクトリの組では、読めない側をエラーにしたうえで読めた側の子の差分も示し、そのためにローカルとエージェントのパスの検査が参照先のない symlink の下のパスを SSH と同じく参照先へ辿ってないものとして返すようにした（REQ-cli-022）。指定したパスが多くツリーから解決する場合も、ファイルを一つも解決しなかったパスを子の一覧の取得で確かめ、左右ともディレクトリで配下に比べるファイルがなければ差分なしとする（REQ-cli-025・REQ-cli-077）。FLAG-cli-033 の答えは A1・A4 で記録し、A1 は利用者の決定で左右の両方にある場合に絞った。片側にだけあって配下に比べるファイルのないディレクトリは決まっておらず、FLAG-cli-073 に残した（振る舞いは選んでいない）。"
