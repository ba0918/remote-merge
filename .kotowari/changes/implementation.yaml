    conclusion: new
    reason: >-
      確定した保存moduleの所有先だけを移し、製品のprivate facadeで同じ実体を使う。
      二import・十一可視性と明示承認されたimport順序・constructor折り畳みだけを
      逆変換すると全元blobとmodeが一致する。保存形式・エラー・順序・権限と全consumerは同一で、
      全3109テストのowner・名前・期待値を維持する。依存は既存SHA指定とJSONのkind変更だけである。
      新しい振る舞い・制約や仕様gapはなく、所属変更の根拠は確定した設計判断に置く。
