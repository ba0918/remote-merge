        sha256: sha256:374a23e7e9863821c0becbac5a9b8bcbc9cecdff29380177c608e46f82c17ae1
    conclusion: existing
    reason: >-
      REQ-merge-001は種類の違う既存の書き込み先を変更せず理由付きでスキップすると定め、
      EX-merge-001はリンクとリンク先が変わらないことを求める。TUIのdiffビューでは左が通常ファイルで
      右が末尾symlinkのとき右のリンク先の中身と比較され、execute_hunk_mergeとexecute_write_changesが
      種類を確かめずにリンク先へ書き込んでいた。両関数で左右ツリーにdetermine_merge_actionを当て、
      SkipDifferentKindならhunkの適用前、変更の書き込みでは両側とも書く前に止めて単一マージと同じ
      理由を表示する。片側だけ書く状態を残さない。実際の読み込みで作ったdiffビューから確認ダイアログと
      w経由で両経路を呼ぶEX-merge-001の契約テストを追加し、修正前はリンク先が左の中身に上書きされて
      失敗し、修正後に成功することを確認した。既存の種類違いテストはリンク先のmtimeをリンクに揃え、
      秒の境目でmtime警告に止まる不安定さを除いた。要求・IR・決定は変えない。
    requirements:
      - REQ-merge-001
