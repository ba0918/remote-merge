  - path: docs/ir/ssh/remote-shell.md
    sha256: "sha256:06fb2b3b5e8170182119eb8411934214e6b0513e55687ca58e8d427718cf0f61"
  conclusion: existing
  reason: "SSH の一括読み込みの形式を、各ファイルの読めたかどうかとバイト数を出す形式に替え、通常ファイルでないか読めなかったパスを結果から外す。結果にないパスは呼び出し元が一件ずつの厳密な読み込みでやり直し、merge と sync は REQ-merge-017 のとおり空の中身とみなさずに失敗を報告し、REQ-merge-019 の \"read failed: right: 原因\" を出す。件数・バイト数・印が合わない出力は呼び出し全体を失敗にする。出力の区切りの形を固定していた単体テストは、仕様が契約にしていない形なので除いた。REQ-ssh-020 のとおり一括読み込みのコマンドも sh -c に包んで送るので、分割の見積もりを包んだ後の長さで行い、引用符の多いパスでもコマンド長の上限を守る（既存の分割のテストを包んだ後の長さで確かめる形に改めた）。新しい文言は決めていない。"
  requirements:
  - REQ-merge-017
  - REQ-merge-019
  - REQ-ssh-020
  decisions: []
  handoff: null
  gaps: []
