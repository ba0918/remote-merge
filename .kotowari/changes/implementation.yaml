    conclusion: new
    reason: "TUI を完全に取り除く決定（A1・A3・A4・A12）に従い、TUI のコード・テスト・テストの道具・events と操作イベントの記録、TUI だけが使っていた依存と下位 crate の項目を除いた。引数なしの起動はサブコマンドを必須にして使い方を出し終了コード 2 で終わり何も書き込まず、--help と --version は例外として標準出力に出し終了コード 0 で終わる（A2・A19・A24、REQ-cli-076）。CLI の実行は agent を除き情報レベル以上の診断ログを保存し、開けなければ黙って続け、10MB を超えれば実行の始めに切り詰める（A14・A16〜A18、REQ-cli-075・014・015）。ファイルには target が remote_merge で始まる自身の記録だけを通し、外部の crate の記録とリモートの標準エラーの中継は細かさの指定にかかわらず残さない（A22）。キャッシュの場所が決まらなければ /tmp に逃がさず保存をあきらめ、logs は何も出さない（A23）。--log-level は粗い指定でもファイルをその細かさにし、手引きの説明をこれに合わせた（A25）。確認手段のない接続の拒否は is_tui をなくし標準入力の確認で担う（A20、REQ-ssh-001・002）。badge_scan_max_files は値を検査せずに一度だけ警告して使わない（A5・A13・A21、REQ-config-031・013・017・027）。期限切れの整理は merge・sync の開始時だけになり（A7、REQ-backup-025）、hunk マージの確認と REQ-backup-020 のテストを除いた（A7・A15）。--config を無視するサブコマンドのテストは logs に絞った（A4、REQ-config-028）。文書と CLI の説明を CLI 専用に書き直した（A11）。"
