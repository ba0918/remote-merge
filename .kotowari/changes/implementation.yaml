    conclusion: new
    reason: 利用者が採用した三つのサポートモジュールだけを既存29単体テストと共に移し、他の3080件の所在・名前・無視状態を保つ。hintの全本文と他二ファイルの四箇所のtarget追加だけを除いた本文およびGit modeが一致し、同じtrait・型と既存公開パス、設定型・ポリシー・パスフレーズ取得とゼロ化・ヒント文字列を維持する。依存変更はSSHから既存settings・rpassword・zeroize・serial_testへの四辺だけで、外部依存版・featureと他の実装を変更しない。ホストキーの三ログは動的比較、端末エラーのdebugは静的照合のみであり、未実行経路を検証済みと扱わない。
