  conclusion: existing
  reason: "REQ-cli-078 と REQ-merge-007 のとおり、diff・merge（--hunks を含む）・sync のパスの引数に絶対パスか \"..\" の要素があれば、サーバの解決・バックアップの整理・接続・走査の前に、入力されたままの値で \"absolute subpath not allowed: パス\" か \"path traversal not allowed: パス\" のエラーで止め、終了コード 2 を返して何も書かない。検査は engine の rel_path::check_rel_path 一つにまとめ、引数用の check_path_arguments が REQ-cli-052 の root_dir 全体を指す値（\"/\"・\".\"・\"./\"・空）を飛ばしてから呼ぶ。SSH の経路のパスの組み立て（validate_remote_path）は先頭の \"/\" を削る読み替えをやめて同じ関数で拒否し、root_dir 全体は空の値で指す（多層の防御で、引数の検査の後に利用者の入力は届かない）。EX-merge-013・EX-merge-014 の既存テストは承認済みの要件の改訂に合わせ、文言の全体と書き込み先の中身が変わらないことを確かめる形に直した。新しい文言は IR が決めたもの以外にない。"
