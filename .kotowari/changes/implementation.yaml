    ir: []
    conclusion: new
    reason: >-
      確定した四つのservice判断処理と二つの三者比較classifierの所有先だけを移す。
      sync/rollbackは全blob同一、merge/statusは承認された参照だけを変え、
      classifier本文はenum名だけを変える。製品badge型・label/style・docsと20テストは同一で、
      二つの旧signatureは下位結果を全variantで同じbadgeへ変換する。
      125既存テストはownerだけを移し、他2984件と消費側・serde表現・依存版とfeatureを維持する。
      新しい振る舞い・制約や仕様gapはなく、所属変更の根拠は確定した設計判断に置く。
