  conclusion: existing
  reason: "SSH の一括読み込みの形式を、各ファイルの読めたかどうかとバイト数を出す形式に替え、通常ファイルでないか読めなかったパスを結果から外す。結果にないパスは呼び出し元が一件ずつの厳密な読み込みでやり直し、merge と sync は REQ-merge-017 のとおり空の中身とみなさずに失敗を報告し、REQ-merge-019 の \"read failed: right: 原因\" を出す。件数・バイト数・印が合わない出力は呼び出し全体を失敗にし、部分的な結果を正しい結果にしない。契約テストは、読めないリモートのファイル（REQ-merge-017・REQ-merge-019）、親ディレクトリのないリモートへの symlink の作成（REQ-merge-023）、消せないリモートのファイルの削除の失敗（REQ-merge-034）を Agent を使わない SSH の経路で確かめる。どれも既存の要件の文の範囲で、新しい文言を決めていない。"
  requirements:
  - REQ-merge-017
  - REQ-merge-019
  - REQ-merge-023
  - REQ-merge-034
  decisions: []
  handoff: null
  gaps: []
