  conclusion: new
  reason: "終了ステータスなしで終わったバイト列の実行を接続エラーにし、途中で切れた一括読み込みを REQ-ssh-003 の再接続と再試行の対象にする。走査の起点の確認は終了コード 1 だけを REQ-scan-015 の \"Remote root_dir not found\" にする。リモートの削除と symlink の作成は終了コードを検査する実行に替え、REQ-merge-034 の削除の失敗と REQ-merge-023 の symlink の作成（親ディレクトリを先に作る）を報告する。要件の文が直接決めていなかった扱いは判断の記録に残し、REQ-merge-038〜041 と REQ-ssh-020 として IR に書いた（A6）: 最後の要素が symlink のパスへ書かない（A1、REQ-merge-038）、書き込みは同じディレクトリの一時ファイルを書き込み先の名前に付け替え、モードを引き継ぐ（A8、REQ-merge-039）、symlink の作成先に何かあれば置き換えず、リンク先の前に -- を置く（A7・A10、REQ-merge-040、EX-merge-049）、削除は -f のない rm でないパスを失敗にする（A4・A9、REQ-merge-041）。A2 は A7 に置き換えた。クライアントはすべてのコマンドを sh -c で送り（A5、REQ-ssh-020）、テスト用 SSH サーバは引用を外したスクリプトで振る舞いを決め、受け取ったコマンドを指定したログインシェルで実行する。競合でだけ起きる扱いは生成したコマンドを sh で実行する単体テストで確かめ、決められていないコマンドの文字列を固定していたテストは除いた。"
