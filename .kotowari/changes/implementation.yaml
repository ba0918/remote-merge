    reason: 確定した七ファイルと既存157単体テストをnested agentのまま内部crateへ移し、テスト名と他2952件の所在・無視状態を保つ。32イベントと1DEBUG guardのtarget追加だけを除く全本文とmodeおよび全テスト本文が一致し、run_agent_loopのprivate範囲と元のUnix gateを維持する。製品の公開パスとcore/protocol/russh/tokioの同じ型を再公開で保ち、製品CLI_VERSION・build.rs・deployは変更しない。依存は新ローカルpackageと既存指定への辺だけで外部版と他の依存を変えない。ログtargetは静的照合のみで、未取得の動的イベントや未実行環境を検証済みと扱わない。
