    reason: >-
      承認された所属変更だけを固定base全体で照合する。
      二validatorと二handler moduleの本文、製品の十八テスト、三十の移動テストを維持し、
      hunk純粋部分はbyte sliceとdirectionのbindingおよびEqual/Modified結果wrapperだけを変更する。
      validator先行と両側read、dry-run、backup、writeの順序と公開型identityを維持する。
      source比較と全3111件のretryなし実測pass、旧公開パスのcompile probeで検査し、
      依存・feature・製品0.2.13・通信v4・IR・テスト期待値を変えない。
      新しい振る舞い・制約・仕様gapや独立レビューの承認をこの所属変更記録で宣言しない。
