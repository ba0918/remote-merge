    ir: []
    conclusion: new
    reason: >-
      確定したローカル自由関数とパス検査だけを移し、製品adapterとprivate境界を維持する。
      十一可視性・旧warn targetと個別に記録したsignature整形だけを逆変換して全helper本文を照合し、
      enumと検査は承認されたroot/Self参照と正確な四space dedentだけを変える。
      製品二ファイルは抽出block・再公開・未使用import除去と検査委譲以外同一で、
      全3109テストのowner・名前・cfg・期待値と全consumer、protocol/coreの実体を維持する。
      新しい振る舞い・制約や仕様gapはなく、所属変更の根拠は確定した設計判断に置く。
