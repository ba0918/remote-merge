    ir: []
    conclusion: new
    reason: >-
      確定した共有Sideと五つのservice基礎moduleの所有先だけを移し、
      六つの全元本文とmode、同じnominal型、旧公開パス、serde表現とprivate helpersを維持する。
      152既存テストはownerだけを移し、Sideの15件だけ接頭辞を変更する。他2957件は同一である。
      engineにserde通常依存と既存JSONテスト用serde_json dev依存だけを追加し、
      消費側・実行処理・I/Oと他の依存版やfeatureは変更しない。
      新しい振る舞い・制約や仕様gapはなく、所属変更の根拠は確定した設計判断に置く。
