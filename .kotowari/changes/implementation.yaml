  conclusion: new
  reason: "終了ステータスなしで終わったバイト列の実行を接続エラーにし、途中で切れた一括読み込みを REQ-ssh-003 の再接続と再試行の対象にする。走査の起点の確認は終了コード 1 だけを REQ-scan-015 の \"Remote root_dir not found\" にし、接続エラーをそのまま返す。一括読み込みはコマンド全体の失敗を見る実行に替える（REQ-merge-017）。リモートの削除と symlink の作成は終了コードを検査する実行に替え、REQ-merge-034 の削除の失敗と REQ-merge-023 の symlink の作成（親ディレクトリを先に作る）を報告する。要件の文が直接決めていない三つは判断の記録に残した: 書き込みは最後の要素が既存の symlink なら書かずに失敗し（A1、REQ-merge-001。途中の symlink は REQ-merge-004 のとおり辿る）、symlink の作成先が symlink でない既存のディレクトリなら作らずに失敗し既存の symlink はリンクだけを置き換え（A2、REQ-merge-001・REQ-merge-003）、比べた後に消えていた削除の対象は失敗にする（A4、REQ-merge-033 と同じ理由、REQ-merge-034）。テスト用 SSH サーバは書き込みのコマンドを含まれる書き込みの部分で見分ける。"
