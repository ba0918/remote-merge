    conclusion: new
    reason: "SSH の一件ずつの読み込みを、openssl で読んだ後にディレクトリでないことを確かめる形にし、ディレクトリをローカルとエージェントと同じくエラーにした。diff はディレクトリを子の一覧の取得の成否で判定し、左右とも子のないディレクトリ（中身の空なもの、include の外のもの）を差分なしとする（REQ-cli-025・REQ-cli-052、include の外は利用者の決定 A1 による新しい REQ-cli-077）。この判定のため diff が使う SSH の子の一覧の取得を find の終了コードを見る形にし（ルートの一覧は変えない）、SSH の側だけ参照先がない symlink もエラー終了にした（REQ-cli-022、A3）。diff がディレクトリを子のパスに展開するとき、ディレクトリでないと分かっている側（子の一覧が取れず中身を通常ファイルとして読めた側、参照先を読めない symlink でそのパスの誤りを記録した側、既にないものとした側の下）にだけその子がないものとし、その側の子のパスを調べも読みもしない。子の一覧の取得に失敗しただけの側（読む権限のないディレクトリ、SSH の一覧の取得の失敗）はないものとせず、比較元と同じくその側でも子を調べて読む。これにより通常ファイルと SSH のディレクトリ symlink の組でも配下を子パスで示し（REQ-cli-021、A2）、片側が参照先のない symlink、もう片側がディレクトリの組では、読めない側をエラーにしたうえで読めた側の子の差分も示す（REQ-cli-022）。rollback・バックアップ・書き込みも使うローカルとエージェントの共有のパスの検査は比較元のまま変えていない。指定したパスが多くツリーから解決する場合も、ファイルを一つも解決しなかったパスを子の一覧の取得で確かめ、左右ともディレクトリで配下に比べるファイルがなければ差分なしとする（REQ-cli-025・REQ-cli-077）。ルートの指定（「.」と「./」）はこの確かめから外し、ツリーから解決した結果だけで決める従来の振る舞いを保った。この確かめで利用者の入力したパスがローカルの root_dir の外のディレクトリを一覧しないよう、ローカルの子の一覧はほかのローカルの操作と同じ root_dir の内側の検査を通してから読む（入力パスの親ディレクトリへの遡りを禁じる REQ-cli-026）。FLAG-cli-033 の答えは A1・A4 で記録し、A1 は利用者の決定で左右の両方にある場合に絞った。片側にだけあって配下に比べるファイルのないディレクトリは決まっておらず、FLAG-cli-073 に残した（振る舞いは選んでいない）。子がすべて exclude に当たるディレクトリを指定した diff がどの経路でも差分なしになることは、利用者の決定 A5 で決めずに FLAG-cli-031 に観察として加えた。"
