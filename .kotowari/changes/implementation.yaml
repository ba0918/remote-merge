    conclusion: new
    reason: 確定した六つの配置実装を下位Agentへ移し、版生成を担う四つの製品入口は旧signatureの委譲関数としてCLI_VERSIONを明示的に渡す。既存122配置テストの本文を正しいownerに一度ずつ保ち、34件だけのownerを移し、88製品版依存テストと他3075件の所在・名前・無視状態を維持する。指定した版引数と参照、五つのtarget追加、test/helper配置だけを逆変換すると元の全production本文が一致し、型・default・private helperの境界を再公開で保つ。build scriptは元の製品scriptと全bytes一致し、lock変更はdirs辺のみ、SSHは既存pathを通常依存へ移す。未取得の動的ログや未実行環境は検証済みと扱わない。
