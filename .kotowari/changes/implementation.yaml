    sha256: "sha256:06fb2b3b5e8170182119eb8411934214e6b0513e55687ca58e8d427718cf0f61"
  conclusion: new
  reason: "リモートのログインシェルが fish のサーバで Bourne の構文のコマンドが失敗していたので、すべてのコマンドをスクリプトを一つの引数にした sh -c で送る（A5、REQ-ssh-020）。fish は単一引用符の中でも \\' と \\\\ を解釈するので、単一引用符とバックスラッシュは引用符の外でエスケープする。保証するログインシェルは確かめた Bourne 系と fish に絞り、単一引用符の中の改行を受け付けない csh と tcsh は保証しない（A13）。包み方の説明と remote-shell の導入の文もこの範囲に合わせた。包んだ後の長さを数える関数を置き、一括読み込みの分割の見積もりに使う。単体テストは包んだコマンドを sh・bash・dash・fish で実行して包む前と同じ出力を確かめ、契約テストはログインシェルを fish にした試験サーバで書き込み・symlink の作成・削除を含む merge が成功することを確かめる。fish がない環境では飛ばすが、CI はテストのジョブに fish を入れて REMOTE_MERGE_TEST_REQUIRE_FISH を置き、そのときは fish がないことを失敗にする（A12）。テスト用 SSH サーバの引用を外す関数はテスト側に置いた。"
