    reason: "機密を守ることをツールの責務から外す決定（A1・A2）に従い、設定の読み込みが機密のパターンを返さないようにして [filter] sensitive の指定を一度だけ警告して捨て（A4・A9、REQ-config-030）、status・diff・merge・sync・rollback・--hunks・TUI から機密の判定・非表示・除外・警告・持ち出し確認と JSON の sensitive 欄・テキストの [SENSITIVE] の印を除いた（A2・A5・A10）。--force の機密以外の役目は残してヘルプから機密の記述を除き（A6）、diff の --force は効果のないオプションとして受け付けたまま残した（A14）。診断の記録にファイルの中身を含めない規則と root_dir の外の扱いは変えていない（A3・A13、REQ-cli-015・REQ-cli-026）。手引きから機密の扱いを除き、読ませたくないファイルはツールの外側か exclude で外すと案内した（A12）。除いた要件だけを確かめるテストは消し、残る要件のテストは .env を他のファイルと同じに扱う形に直した。"
