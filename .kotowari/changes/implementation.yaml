    reason: "\u7248\u306e\u78ba\u8a8d\u3088\u308a\u524d\u306b\u914d\u7f6e\u5148\u306e\u30c7\u30a3\u30ec\u30af\u30c8\u30ea\u3092\u4e00\u3064\u306e POSIX sh \u306e\u30b3\u30de\u30f3\u30c9\u3067\u691c\u67fb\u3059\u308b\u3002\u306a\u3051\u308c\u3070 mkdir -m 700 \u3067\u4f5c\u308a\uff08sudo=true \u3067\u306f sudo \u3067\u4f5c\u308b\uff09\u3001symlink \u3067\u3042\u308b\u3068\u304d\u3001\u6240\u6709\u8005\u304c SSH \u306e\u30bb\u30c3\u30b7\u30e7\u30f3\u306e id -u\uff08sudo=true \u3067\u306f 0\uff09\u3067\u306a\u3044\u3068\u304d\u3001ls -ldn \u306e\u6a29\u9650\u306e\u5217\u3067\u30b0\u30eb\u30fc\u30d7\u304b\u305d\u306e\u4ed6\u304c\u66f8\u304d\u8fbc\u3081\u308b\u3068\u304d\u306f\u4e2d\u306e\u3082\u306e\u3092\u4f55\u3082\u5b9f\u884c\u305b\u305a\u3001Agent \u3092\u8d77\u52d5\u3067\u304d\u306a\u3044\u65e2\u5b58\u306e\u7d4c\u8def\u306b\u4e57\u305b\u308b\uff08A3\u3001REQ-ssh-014\u30fbREQ-ssh-015\u3002sudo=false \u3067\u306f SSH \u306e\u7d4c\u8def\u3067\u7d9a\u3051 REQ-ssh-005\u3001sudo=true \u3067\u306f\u6b62\u307e\u308b REQ-ssh-009 \u3092\u5909\u3048\u306a\u3044\uff09\u3002\u7248\u304c\u4e00\u81f4\u3057\u305f\u3068\u304d\u3082\u30ed\u30fc\u30ab\u30eb\u306e Agent \u306e\u30d0\u30a4\u30ca\u30ea\u3092\u89e3\u6c7a\u3067\u304d\u308c\u3070 SHA-256 \u3092\u7167\u5408\u3057\u3001\u4e0d\u4e00\u81f4\u304b __UNSUPPORTED__ \u306a\u3089\u7248\u304c\u9055\u3046\u3068\u304d\u3068\u540c\u3058\u914d\u7f6e\u306e\u7d4c\u8def\u3067\u7f6e\u304d\u76f4\u3057\u3001\u89e3\u6c7a\u3067\u304d\u306a\u3051\u308c\u3070\u7167\u5408\u305b\u305a\u306b\u5b9f\u884c\u3059\u308b\uff08A4\u3001REQ-ssh-016\uff09\u3002\u65b0\u3057\u3044\u6587\u8a00\u3084\u7d42\u4e86\u30b3\u30fc\u30c9\u306f\u5951\u7d04\u306b\u3057\u3066\u3044\u306a\u3044\u3002umask \u306b\u3088\u3063\u3066\u30b0\u30eb\u30fc\u30d7\u304c\u66f8\u304d\u8fbc\u3081\u308b\u30e2\u30fc\u30c9\u306b\u306a\u308b\u65e2\u5b58\u306e\u8a66\u9a13\u306e\u914d\u7f6e\u5148\u306f\u30e2\u30fc\u30c9\u3092\u660e\u793a\u3057\u3001Agent \u3092\u4f7f\u3046\u65e2\u5b58\u306e\u8a6