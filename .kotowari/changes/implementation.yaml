    conclusion: new
    reason: 確定した四ファイルの閉じた依存を既存52単体テストと共にSSHへ移し、他3057件の所在・名前・無視状態を保つ。30のtarget追加だけを除く全本文とmodeおよびテスト本文が一致し、exec_strictの制限と本文を維持する。委譲関数と三runtime呼び出しは同じ入力・エラー処理を保ち、製品側のbridgeと内部SSHモジュールは外部からアクセスできない。不要なprivate別名を退役し、既存settings/core/config項目をprivateに再利用する。依存は既存指定の九辺とtest-utils転送だけで、外部版と他の依存を変えない。ログtargetは静的照合のみで、未取得の動的イベントを検証済みと扱わない。
