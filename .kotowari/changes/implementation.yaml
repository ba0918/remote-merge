    reason: >-
      確定した十五ローカル操作とprivate validatorの所属だけを変え、製品のsignature・dispatch・構築・no-opを維持する。
      全本文と製品ファイルを承認されたfield binding・四space dedent・個別fmt hunkだけで照合し、
      canonical検査・エラーchain・filter・順序・hashesの非検査を変えない。
      親担当が許可した未使用private再公開の退役と五helperのtest-only化だけを追加し、
      全3109 identityと混在テスト・consumer・依存版/featureを維持する。
      原producer比較と同一draftの条件付き最終passを実測記録に結び付け、以前の失敗や原因未確認を隠さない。
      新しい振る舞い・制約・仕様gapはなく、所属変更の根拠を現在の確定設計に置く。
