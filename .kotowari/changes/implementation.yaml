    reason: 確定した設計に従いconfig全体と既存89テストを内部crateへ移し、他の3020件の所在・名前・無視状態と全テスト本文を維持する。承認した別名・バックアップ定数の所属と単一参照・helper可視性・三つのtarget追加だけを逆変換すると元の全本文とGit modeが一致する。製品configは既存公開項目だけを明示的に再公開し、helperをprivateに保つ。settingsとcoreの同じ型・エラー、backupの定数と残る全本文を維持する。依存変更は新しいローカルpackageと製品のpath辺だけで既存外部依存を変更しない。ログtargetは静的照合のみで、動的イベント未取得を検証済みと扱わない。
