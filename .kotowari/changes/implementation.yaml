  conclusion: new
  reason: "ローカルの書き込みを O_NOFOLLOW で開き、最後の要素が既存の symlink ならリンクもリンク先も変えずに失敗する（A3、REQ-merge-001）。途中の symlink は O_NOFOLLOW の対象外なので REQ-merge-004 のとおり辿る。そのために engine に Agent と同じ版の libc を unix 向けの依存として足し、Cargo.lock は engine の依存の一覧に libc が加わるだけである。unix 以外では今までどおり書く。"
  requirements:
  - REQ-merge-001
  - REQ-merge-004
