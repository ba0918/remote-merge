    sha256: sha256:b7a89434e43709b64fbce02d685ab101b2997e3705941d3caa0fceba5cb6bc9f
  conclusion: new
  reason: "リモートのログインシェルが fish のサーバで Bourne の構文のコマンドが失敗していたので、すべてのコマンドをスクリプトを一つの引数にした sh -c で送る（A5、REQ-ssh-020）。fish は単一引用符の中でも \\' と \\\\ を解釈するので、単一引用符とバックスラッシュは引用符の外でエスケープする。単体テストは包んだコマンドを sh・bash・dash・fish（入っているものだけ）で実行して包む前と同じ出力を確かめ、契約テストはログインシェルを fish にした試験サーバで書き込み・symlink の作成・削除を含む merge が成功することを確かめる（fish がなければ注記して飛ばす）。テスト用 SSH サーバの引用を外す関数はテスト側に置いた。"
  requirements:
  - REQ-ssh-020
