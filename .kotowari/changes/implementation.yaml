- id: agent-final-symlink
  base: a22ff0bf0551fb6dc2945d776cf18ffc2abe0025
  role: implementer
  files:
  - path: crates/remote-merge-agent/src/agent/file_io.rs
    before: sha256:a38e42e1627003538a0dc40ccf4c6438f645172cefddb6e18001bbe2497d04ed
