  conclusion: new
  reason: ホスト鍵の判定を known_hosts の内容と提示された鍵だけを受け取る関数に切り出した。同じホストが別の鍵種別でだけ登録されているときは、提示された鍵を確かめる登録がないので未知の鍵として確認に回す（REQ-ssh-001・REQ-ssh-002 から導いた A5。strict=yes や確認手段がなければ止まり、--yes や strict=no では承認できる。例 EX-ssh-026）。未知の鍵を承認した直後の再接続は検査を飛ばさず、承認した鍵の種別と base64 に完全に一致する鍵だけを受け入れる（REQ-ssh-001）。ファイルがないこと以外の known_hosts の読み込みの失敗では接続を止め（A1、REQ-ssh-012）、今の照合が一致と判定するホストの書き方で "@revoked" とされた鍵は同じ鍵の通常の行があっても --yes でも受け入れない（A2、REQ-ssh-013。ワイルドカードは扱わない）。known_hosts の行のフィールドは OpenSSH と同じく空白の並び（タブや連続した空白）で区切り、そうした区切りの失効の行も読み飛ばさない。鍵が変わったホストの拒否は変えていない。SSH のクライアントには、sudo=true の配置で root だけが入れる配置先へ書き込むための sudo の書き込みを足した（A12、REQ-ssh-015 の例 EX-ssh-029。既存の書き込みの動作は変えない）。試験サーバにはホスト鍵の公開鍵を返すアクセサと、パスを含まないリモートのターゲットの確認だけのコマンドを受け付ける分岐を足した（A11 の直した配置先で版の確認を省くため）。
