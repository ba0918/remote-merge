        sha256: sha256:374a23e7e9863821c0becbac5a9b8bcbc9cecdff29380177c608e46f82c17ae1
    conclusion: existing
    reason: >-
      REQ-merge-001は種類の違う既存の書き込み先を変更せずスキップすると定め、EX-merge-001は
      通常ファイルから末尾symlinkへのマージでリンクとリンク先が変わらないことを求める。
      TUIのexecute_mergeはSkipDifferentKindでメッセージだけ設定して書き込みへ進んでいたため、
      その分岐で戻るようにした。要求・IR・決定は変えず、既存要求の範囲に収まる。
      確認ダイアログのyからmtime検査を経てexecute_mergeに至る実ハンドラを両方向で呼ぶ
      EX-merge-001の契約テストを追加し、修正前は両方向でリンク先が上書きされて失敗、
      修正後に成功することを確認した。hunkマージと変更書き込みの経路は対象外。
    requirements:
      - REQ-merge-001
    decisions: []
    handoff: null
    gaps: []
