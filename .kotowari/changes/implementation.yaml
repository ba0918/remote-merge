  reason: "SSH の経路のパスの検査スクリプトをローカル（とエージェント）の検査と同じ規則に書き直し、lstat が ENOENT で失敗したときだけ missing（実パスは末尾の要素を含めない）にし、通常ファイルの下・検索権限のないディレクトリの中・自分を指す symlink・リンク切れやループする祖先の symlink の下・存在するディレクトリのすぐ下の NAME_MAX を超える名前・リンク先の存在しない部分の \"..\" はエラーにする。readlink の答えは番兵を足して受け取り、改行で終わる名前やリンク先も削らずに読む。答えは種類とパスを NUL で終えて返し、試験 SSH サーバの模擬の応答（ssh_server.rs）も同じ形にした。これで途中に改行を含むリンク先が読み違えられて root_dir の内側に見えることがなくなり、REQ-cli-026 の root_dir の外の判定が SSH の経路でもローカルと同じ実パスで行われる。REQ-backup-003 のとおり、辿れないパスを含むセッションの rollback は SSH でも一件も書き戻さず全件を \"cannot resolve path: \" で報告し、REQ-backup-033 のリンク切れの末尾の symlink は今までどおり辿った先の場所で比べる。祖先のリンク切れの symlink を辿れないパスと読むことは決定記録 A1 に残した。REQ-backup-031 と EX-backup-027・EX-backup-029・EX-backup-030 のとおり、戻す先の検査が失敗し、戻す先より上の祖先（root_dir は除く）のどれかが辿った先で通常ファイルと分かったとき \"parent directory no longer exists\" でスキップする判定を engine の純粋関数に置き、祖先の種類をローカル・SSH・エージェントで調べる操作を TargetIo に足した。範囲をすぐ上の親から祖先と通常ファイルを指す symlink に広げたことは利用者の判断（A2）で、REQ-backup-031 の文と例も同じ範囲に改めた。エージェントの crate と通信の型は変えていない。StatFiles が root_dir の外へ辿る祖先を拒否するため、その場合だけエージェントの経路はスキップせず \"cannot resolve path: \" で止まる既知の違いを A3 に記した。target_io.rs の SSH の子の一覧の検査、side_io.rs のその単体テスト、scan_listing_cli.rs の AgentFixture の起動関数、contract.rs の mod 行は、REQ-cli-078 と REQ-merge-007 の変更と共有するファイルなのでこの組に含めた。"
