  reason: "REQ-config-040 のとおり、[local] の root_dir が相対パスのときは、カレントディレクトリではなく、その root_dir を書いた設定ファイルのあるディレクトリを基準に絶対パスにする。これまで設定の読み込みは相対のまま渡し、使う側がカレントディレクトリを基準に解決していた（REQ-config-040 は実装されていなかった）。設定ファイルを読んだときに、その書かれた形のパスを [local] の中間の値に覚え、マージで選んだ [local] の root_dir を REQ-config-010 のとおり \"~/\" をホームに展開してから、なお相対のときだけ設定ファイルのディレクトリを求めてつなぎ、\".\" の要素を除く（\"..\" は辿るときに解決するので残す。A66：絶対パスや \"~/\" の root_dir では求めないので、深い作業ディレクトリでも読み込みを止めない）。設定ファイルのディレクトリは、書かれた設定ファイルのパスを OS に実パスへ直させた（canonicalize した）ものの親にする（A65）。symlink の書き方によらず識別が一つになり、以前の版の識別の基準（getcwd の実パス）とも合う。実パスに直せないとき（途中の絶対パスが PATH_MAX を超えるときを含む）は、基準を推し量らずに \"Failed to resolve the directory of config file: パス\" のエラーで設定の読み込みを止める（A65 の既知の例外）。--config のファイルがあるか・通常ファイルかの確かめ（REQ-config-007）と読み込み（REQ-config-006）は書かれたパスの形で OS に渡し、相対の --config の読み込みのエラーはどれもカレントディレクトリにつないだ絶対パスを示す（A64。絶対パスはエラーを示すときだけ求める）。グローバルとプロジェクトの設定はそれぞれ自分のディレクトリを使う。空の root_dir は基準につなぐ前に REQ-config-041 の \"root_dir must not be empty\" で止める（サーバの root_dir と同じ AppError::ConfigValidation、終了コード 2）。テストは REQ-config-041、隣のディレクトリを通る \"..\" の書き方でも中から読んだときと同じ root_dir とバックアップの一覧になること、symlink の直後の \"..\" ではリンク先の側の実パスの root_dir になること、symlink を通るどの書き方でも実パスの同じ root_dir になること（どれも実パスにした一時ディレクトリの下に置く）、深い作業ディレクトリから実パスに直せない相対の --config では絶対パスを示して読み込みが止まること（A65・A64）、4096 バイトより深い作業ディレクトリでも絶対パスの root_dir の設定なら rollback --list が終了コード 0 で動くこと（A66）、EX-config-016（別のディレクトリから --config で指定したプロジェクトの設定の \".\"）とグローバルの設定の相対の root_dir を実行ファイルで確かめる。REQ-backup-021 はローカルの書き込み先を同じ絶対パスで決めると定めており、起動したディレクトリを基準にしていた backup_sessions.rs のテストを、起動したディレクトリによらず同じ書き込み先になる形に改めた。確認の側で相対のローカルの root_dir の作業ディレクトリへのつなぎを除いた変更（A53）は path-resolution-across-routes の組にある。 REQ-backup-043（A57）のとおり、識別が変わる前に保存したセッションも一覧・書き戻し・期限切れの整理で探す。設定に書いた root_dir（\"~/\" の展開後、基準につなぐ前）を LocalConfig の root_dir_as_written に残し、以前の版と同じ規則（相対なら設定読み込み時のカレントディレクトリにつなぎ、正規化しない。既定の \".\" なら \"<カレントディレクトリ>/.\"）で求めた識別のうち、symlink を辿らずに字面で正規化すると今の識別と同じになるものだけ（A58）のキーを、今の識別のキーの後に重複なく並べる。別のディレクトリから --config で設定を指定したとき、作業ディレクトリ自身の書き込み先のセッションを取り違えない。セッションごとに最初に記録があるキーを、一覧と書き戻しで同じ規則で選ぶ。整理の対象のキーにも加える。リモートは REQ-backup-021 の字面の正規化がまだ実装されておらず、書いたままの root_dir が今の識別と同じなので、加えるキーはない。テストは EX-backup-024（以前の版が設定ファイルのあるディレクトリを作業ディレクトリにして保存したセッションが、同じ設定・同じ作業ディレクトリで一覧に出て書き戻せる）と、以前の識別の期限切れのセッションが整理されること、作業ディレクトリ自身で保存したセッションが別の場所の設定の一覧に出ず整理もされないこと（A58）、symlink を通る --config でも作業ディレクトリ（実パス）を基準に保存した以前のセッションが一覧に出ること（A65）を確かめる。"
