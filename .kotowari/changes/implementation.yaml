  conclusion: existing
  reason: "rollback・diff・merge・sync が使うパスの確認を、ローカル・SSH・エージェントのどの経路でも同じ手順で \"/\" から要素ごとに辿る形に作り直した（REQ-paths-001〜011）。手順は core の path_resolution に一つの関数として置き、lstat の種類・readlink・検索権限の基本操作を外から受け取る。ローカルとエージェントは同じ基本操作を使う。Unix では標準ライブラリと libc（検索権限は faccessat の AT_EACCESS）、Unix 以外では標準ライブラリだけを使い、検索権限のビットがないので OS が権限のエラーを返したときだけ \"permission denied\" にする（A54、Windows 向けのターゲットで cargo check が通ることを確かめた）。共有する入口は絶対パスの root_dir だけを受け取る。ローカルの相対の root_dir は設定を読む段階で絶対パスになり（A53、REQ-config-040 の組）、届いた相対パスは基準を推し量らずにエラーにする。リモートの相対の root_dir はログインした利用者の作業ディレクトリを基準にし（REQ-paths-012）、エージェントはプロセスの作業ディレクトリ（getcwd）に、SSH はスクリプトの先頭で組み込みの pwd -P の結果につなぐ。結果は存在しない（親が存在するかの印つき）・存在する・末尾の symlink・途中の祖先がディレクトリでないの四つで、辿れないときは閉じた一覧の原因の文言で \"cannot resolve path: \" のエラーにする。長さ 4096・255 バイトと symlink 40 回の上限、末尾の \"/\"、リンク切れ、存在しない部分の \"..\"、UTF-8 でないリンク文字列は、要素ごとに決まった順で確かめる。エージェントの通信の型をこの四つの種類と原因の文言に変えて通信の版を 5 に上げ、版が 5 未満なら確認だけ SSH で行い、sudo を使うサーバでは置き直しを求めるエラーにする（経路を選ぶ純粋関数 path_route）。SSH の確認スクリプトは同じ状態と順の POSIX sh に書き直し、root_dir と相対パスを分けて渡す。pwd と readlink の出力は x を続けてから取り除き、名前の末尾の改行を保つ。dash と BusyBox ash の pwd -P は作業ディレクトリが消えていると空の行を出して 0 で終わるので、\"/\" で始まらない結果は \"cannot read\" にする（エージェントの getcwd の失敗と同じ答え）。つないだ root_dir は root の欄で出し、製品がリンク文字列と同じくバイト列で読んで UTF-8 でなければ \"non-UTF-8 path\" で止める（ローカルとエージェントと同じ箇所）。まだ辿っていない要素はリンク先ごとの残りを位置パラメータと番号付きの変数に積み、途中のリンク先の一覧は末尾から除くので、要素を取り出すたびに残り全体を写さない（A55。4090 バイトほどのリンク先が 40 個連なる状態で dash 2.4 秒→0.7 秒、bash 6.3 秒→1.7 秒）。SSH の cd が権限以外の理由で失敗したときも \"permission denied\" になることは既知の例外とした（A52）。検索権限は cd の成否で判定し（A48）、先頭で LC_ALL=C を代入し（A49）、読んだリンク文字列を出力に含めて製品がバイト列のまま読む（A50、そのため ssh の crate のバイト列の実行関数を公開した）。読み取りは一覧にない文言（UTF-8 でない原因の文言を含む）・知らない種類・欠けた欄・余った欄をエラーにする。エージェントの接続のロックが壊れていて通信の版が分からないときは、経路を選ばずにエラーにする（sudo を使うサーバを SSH に回さない、A45）。試験 SSH サーバの模擬の応答（ssh_server.rs）も新しい形にし、パスの確認のコマンドを見分ける判定を、エージェントの経路を使う試験の前提の確認（scan_listing_cli.rs）と共有し、その判定は test-utils の機能で公開した製品のコマンドの先頭の並び（remote_path の INSPECT_PATH_PREFIX）を読む。rollback は確認の結果を純粋な関数で読み、途中の祖先が通常ファイル（か通常ファイルを指す symlink）ならスキップ、それ以外のディレクトリでない祖先は REQ-backup-003 のエラーにし、祖先が通常ファイルかを経路ごとに問い合わせていた処理は消した（EX-backup-027・029・030 の三つの経路のテストは変えずに通る）。確認の原因の文言には接頭辞を二重に足さない。rollback 以外（diff・merge・sync・バックアップの作成）は途中の祖先がディレクトリでないことを \"cannot resolve path: not a directory\" のエラーとして受け取り（CoreRuntime の確認の入口の一か所で読み替える）、diff の root の外のリンクの判定は確認のエラーをパスごとのエラーとして示す。普通のパスでは新しい実パスが canonicalize の結果とバイト列で同じことを確かめた（A13）。三つの経路の一致は、例の状態の表と生成した状態の proptest で、ローカル・このマシンの sh で動かしたスクリプト・通信の形式で往復させたエージェントの答えを比べて確かめ、相対の root_dir は名前が改行で終わる作業ディレクトリと UTF-8 でない作業ディレクトリで、起動したエージェントのプロセスを含めて比べる。消えた作業ディレクトリでは、ローカルには作業ディレクトリに当たるものがないので、SSH とエージェントがどちらも \"cannot read\" で止まることを確かめる。EX-paths-025 は SSH とエージェントで確かめる。契約でない内部の形（コマンドの先頭の並び全体、出力の欄の読み戻し）を固定していた単体テストは除いた。このブランチの前半で入れた REQ-backup-031 の祖先の範囲（A2）と、その三つの経路の契約テスト（rollback_path_ssh.rs・rollback_path_agent.rs、scan_listing_cli.rs の AgentFixture の起動関数）もこの組に含める。target_io.rs・side_io.rs・contract.rs・diff.rs・merge_paths.rs は REQ-cli-078 と REQ-merge-007 の変更と共有する。 local_io.rs・os.rs・file_io.rs の相対の root_dir の扱いは、REQ-config-040 の組と合わせて A53 を満たす。"
