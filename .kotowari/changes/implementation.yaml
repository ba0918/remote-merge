    reason: "\u30db\u30b9\u30c8\u9375\u306e\u5224\u5b9a\u3092 known_hosts \u306e\u5185\u5bb9\u3068\u63d0\u793a\u3055\u308c\u305f\u9375\u3060\u3051\u3092\u53d7\u3051\u53d6\u308b\u95a2\u6570\u306b\u5207\u308a\u51fa\u3057\u305f\u3002\u540c\u3058\u30db\u30b9\u30c8\u304c\u5225\u306e\u9375\u7a2e\u5225\u3067\u3060\u3051\u767b\u9332\u3055\u308c\u3066\u3044\u308b\u3068\u304d\u306f\u3001\u63d0\u793a\u3055\u308c\u305f\u9375\u3092\u78ba\u304b\u3081\u308b\u767b\u9332\u304c\u306a\u3044\u306e\u3067\u672a\u77e5\u306e\u9375\u3068\u3057\u3066\u78ba\u8a8d\u306b\u56de\u3059\uff08REQ-ssh-001\u30fbREQ-ssh-002 \u304b\u3089\u5c0e\u3044\u305f A5\u3002strict=yes \u3084\u78ba\u8a8d\u624b\u6bb5\u304c\u306a\u3051\u308c\u3070\u6b62\u307e\u308a\u3001--yes \u3084 strict=no \u3067\u306f\u627f\u8a8d\u3067\u304d\u308b\u3002\u4f8b EX-ssh-026\uff09\u3002\u672a\u77e5\u306e\u9375\u3092\u627f\u8a8d\u3057\u305f\u76f4\u5f8c\u306e\u518d\u63a5\u7d9a\u306f\u691c\u67fb\u3092\u98db\u3070\u3055\u305a\u3001\u627f\u8a8d\u3057\u305f\u9375\u306e\u7a2e\u5225\u3068 base64 \u306b\u5b8c\u5168\u306b\u4e00\u81f4\u3059\u308b\u9375\u3060\u3051\u3092\u53d7\u3051\u5165\u308c\u308b\uff08REQ-ssh-001\uff09\u3002\u30d5\u30a1\u30a4\u30eb\u304c\u306a\u3044\u3053\u3068\u4ee5\u5916\u306e known_hosts \u306e\u8aad\u307f\u8fbc\u307f\u306e\u5931\u6557\u3067\u306f\u63a5\u7d9a\u3092\u6b62\u3081\uff08A1\u3001REQ-ssh-012\uff09\u3001\u4eca\u306e\u7167\u5408\u304c\u4e00\u81f4\u3068\u5224\u5b9a\u3059\u308b\u30db\u30b9\u30c8\u306e\u66f8\u304d\u65b9\u3067 \"@revoked\" \u3068\u3055\u308c\u305f\u9375\u306f\u540c\u3058\u9375\u306e\u901a\u5e38\u306e\u884c\u304c\u3042\u3063\u3066\u3082 --yes \u3067\u3082\u53d7\u3051\u5165\u308c\u306a\u3044\uff08A2\u3001REQ-ssh-013\u3002\u30ef\u30a4\u30eb\u30c9\u30ab\u30fc\u30c9\u306f\u6271\u308f\u306a\u3044\uff09\u3002known_hosts \u306e\u884c\u306e\u30d5\u30a3\u30fc\u30eb\u30c9\u306f OpenSSH \u3068\u540c\u3058\u304f\u7a7a\u767d\u306e\u4e26\u3073\uff08\u30bf\u30d6\u3084\u9023\u7d9a\u3057\u305f\u7a7a\u767d\uff09\u3067\u533a\u5207\u308a\u3001\u305d\u3046\u3057\u305f\u533a\u5207\u308a\u306e\u5931\u52b9\u306e\u884c\u3082\u8aad\u307f\u98db\u3070\u3055\u306a\u3044\u3002\u9375\u304c\u5909\u308f\u3063\u305f\u30db\u30b9\u30c8\u306e\u62d2\u5426\u306f\u5909\u3048\u3066\u3044\u306a\u3044\u3002SSH \u306e\u30af\u30e9\u30a4\u30a2\u30f3\u30c8\u306b\u306f\u3001sudo=true \u306e\u914d\u7f6e\u3067 root \u3060\u3051\u304c\u5165\u308c\u308b\u914d\u7f6e\u5148\u3078\u66f8\u304d\u8fbc\u3080\u305f\u3081\u306e sudo \u306e\u66f8\u304d\u8fbc\u307f\u3092\u8db3\u3057\u305f\uff08A12\u3001REQ-ssh-015 \u306e\u4f8b EX-ssh-029\u3002\u65e2\u5b58\u306e\u66f8\u304d\u8fbc\u307f\u306e\u52d5\u4f5c\u306f\u5909\u3048\u306a\u3044\uff09\u3002\u8a66\u9a13\u30b5\u30fc\u30d0\u306b\u306f\u30db\u30b9\u30c8\u9375\u306e\u516c\u958b\u9375\u3092\u8fd4\u3059\u30a2\u30af\u30bb\u30b5\u3068\u3001\u30d1\u30b9\u3092\u542b\u307e\u306a\u3044\u30ea\u30e2\u30fc\u30c8\u306e\u30bf\u30fc\u30b2\u30c3\u30c8\u306e\u78ba\u8a8d\u3060\u3051\u306e\u30b3\u30de\u30f3\u30c9\u3092\u53d7\u3051\u4ed8\u3051\u308b\u5206\u5c90\u3092\u8db3\u3057\u305f\uff08A11 \u306e\u76f4\u3057\u305f\u914d\u7f6e\u5148\u3067\u7248\u306e\u78ba\u8a8d\u3092\u7701\u304f\u305f\u3081\uff09\u3002"
