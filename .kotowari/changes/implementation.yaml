    conclusion: new
    reason: >-
      2026-10-04 の利用者の指示（判断がいらない FLAG は全て対処）に基づき、仕分けで利用者の判断が要らないとした
      FLAG を閉じる。承認済みの要件で既に決まっているものは記録だけで閉じ、IR が黙っている今の挙動のうち
      安全側で他の読み方がないものは要件や表の行として追認して印付きの契約テストで固定し、承認済みの要件に
      実装が反するものはテストを先に書いて失敗を確かめてから実装を要件に合わせた。承認済みの要件の文は
      書き換えず、既存の文と矛盾しない一文の追記に限った。前提が崩れた backup-006・config-012・cli-045 は
      変更せずに FLAG を残した。各判断の根拠と委任の範囲は五つの決定記録にある。
