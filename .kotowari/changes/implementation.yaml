    conclusion: existing
    reason: >-
      マージ前の確認と拒否時の宛先保護を変えず、許可されたテスト方法だけを改善する。
      実PTYの確認、所有fixtureの確認状態から取消状態への遷移、取消前後の宛先内容、独立した終了EOFを検査する。
      有限の実子プロセスによる出力消費と状態待機の回帰検査を加え、既存製品コード・IR・依存を変えない。
      既存テレメトリのフィールドや英語文言を新しい製品契約とせず、REQ-tui-002の振る舞いを観測する手段に使う。
      REQ-testing-009に沿って差分描画に合う観測方法を選び、無制限producerの終了・メモリ保証は主張しない。
      過去の取消失敗の根本原因が証明されたとは扱わず、現行の有限producerとfixture TUIだけを受入範囲とする。
    requirements:
      - REQ-tui-002
      - REQ-testing-009
    decisions:
      - docs/decision/records/2026-10-04-tui-cancellation-test-method.md#A1
      - docs/decision/records/2026-10-04-tui-cancellation-test-method.md#A2
