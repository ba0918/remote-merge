# 変異テストの見逃しのうち、観測できる違いを生まないと判断した同等変異の一覧。
# 登録は別の文脈でその変異を落とすテストを書こうとして書けなかったときだけ行い、why にその試みを書く。
- file: crates/remote-merge/src/backup/mod.rs
  change: replace backup_timestamp -> String with String::new()
  text: Utc::now().format("%Y%m%d-%H%M%S").to_string()
  class: equivalent
  why: backup_timestamp の値はバックアップが無効なときの merge・sync のセッション ID にだけ使われ、その ID が流れる保存・削除の表示・セッションの片付けは全てバックアップが有効なときの分岐の中にあり、結果の出力にも集約先にも届かない。別の文脈のエージェントに merge・sync の公開された入口からこの変異で落ちるテストを書かせたが、観測できる違いが見つからず書けなかった
- file: crates/remote-merge/src/backup/mod.rs
  change: replace backup_timestamp -> String with "xyzzy".into()
  text: Utc::now().format("%Y%m%d-%H%M%S").to_string()
  class: equivalent
  why: 上の String::new() の変異と同じ理由。無効時のセッション ID は出力にも集約先にも届かず、別の文脈のエージェントも落ちるテストを書けなかった
- file: crates/remote-merge/src/runtime/backup_store.rs
  change: replace += with *= in BackupStore::cleanup_expired
  text: removed += 1;
  class: equivalent
  why: 変わるのは cleanup_expired が返す削除した数だけで、期限切れの削除そのものは変わらない。製品コードでこの戻り値を使う三か所（TUI の起動、merge、sync の開始）はどれもエラーかどうかしか見ない。別の文脈のエージェントは CoreRuntime::cleanup_expired_backups の戻り値を直接確かめるテストでしか落とせず、削除した数は IR のどこにも定められていないため根拠にならないテストだった
- file: crates/remote-merge/src/service/rollback.rs
  change: replace match guard force with true in plan_restore
  text: None if force => sessions.first().unwrap(),
  class: equivalent
  why: この腕に来るのは --session がなく全てのセッションが期限切れのときだけで、変異で選ばれる最新のセッションも期限切れのため、直後の「期限切れは --force なしでは戻さない」の確かめで元のコードと同じ AllExpired のエラーになる。別の文脈のエージェントに execute_rollback と plan_restore の直接の呼び出しから落ちるテストを書かせたが、エラーの種類も文言も出力も終了コードも同じで書けなかった
- file: crates/remote-merge/src/cli/status.rs
  change: replace && with || in execute_status
  text: if !hash_resolved && !paths_to_compare.is_empty() {
  class: equivalent
  why: 変わるのはハッシュで判定が済んだときと比べるパスがないときに中身の比較を呼ぶことだけで、ハッシュで判定が済むのは --ref がないときに限られ、そのとき中身は一つも取得されず、比べるパスがないときも同じく空の組で呼ばれるため、判定は何も変わらない。別の文脈のエージェントに status の公開された入口（execute_status と SSH fixture の実行ファイル、agent の有無、--checksum・--ref・フィルター・読めないファイルの組み合わせ）から落ちるテストを書かせたが、出力が全て元のコードと一致し書けなかった
- file: crates/remote-merge/src/service/status.rs
  change: replace path_is_within_unloaded_dir -> bool with true
  text: path.strip_prefix(dir)
  class: equivalent
  why: この関数は未読み込みのディレクトリ（children が None のディレクトリ）があるときだけ呼ばれるが、status のツリーは再帰の走査からしか作られず、ローカル・SSH・agent のどの経路でもディレクトリの children は必ず Some になるため、呼ばれることがない。別の文脈のエージェントに、空ディレクトリ・ディレクトリへのリンク・切れたリンク・除外や include・走査件数の上限・読めないディレクトリを含む構成で status の公開された入口から落ちるテストを書かせたが、出力が全て元のコードと一致し書けなかった
- file: crates/remote-merge-core/src/diff/engine.rs
  change: replace match guard tag == replace_tag with true in apply_selected_hunks_single_pass
  text: "tag if tag == replace_tag => {"
  class: equivalent
  why: DiffTag は Equal・Delete・Insert の三つだけで、keep_tag と replace_tag はどちらの方向でも Delete と Insert を一つずつ受け持つ。match の腕は Equal、keep_tag、replace_tag の順のため、三つ目の腕に来る値は必ず replace_tag で、条件を true にしても同じ腕に入る。別の文脈のエージェントに merge の公開された入口（execute_merge の --hunks、重複した番号、三つの変更、片側だけの行、末尾の改行のない内容、CRLF と空行）から落ちるテストを書かせたが書けず、関数を直接呼んで両方向・全ての選び方の出力を比べても元のコードと一致した
- file: crates/remote-merge-core/src/diff/engine.rs
  change: replace < with <= in apply_selected_hunks_single_pass
  text: "if hunk_idx < merge_hunks.len() {"
  class: equivalent
  why: 変わるのは選んだ番号に hunk の数と等しいものがあるときに黙って無視するか panic するかだけで、製品で唯一の呼び出し元の execute_hunk_merge は hunk の数以上の番号を先に "Hunk index N is out of range" のエラーで止めるため、そのような番号が渡ることがない。別の文脈のエージェントに merge の公開された入口から落ちるテストを書かせたが、番号が hunk の数と等しいと呼び出しの前に範囲外のエラーで止まり書けなかった。落とせたのはこの関数を直接呼んで hunk の数と等しい番号を渡すテストだけで、その入力は IR のどこにも定められていないため根拠にならないテストだった
- file: crates/remote-merge/src/cli/diff.rs
  change: replace == with != in execute_diff
  text: "} else if path == \"./\" {"
  class: equivalent
  why: 変わるのは末尾の "/" を取ると空になるパス（""・"/"・"//"）がそのまま残るか "." になるかだけで、どちらも root_dir を指すパスとして扱われる。execute_diff がパスを渡す走査の範囲の判定（resolve_scan_strategy）と対象の解決（resolve_target_files_from_statuses）はどちらも末尾の "/" を取って "." か空なら root_dir 全体とし、それより後はパスを読まない。別の文脈のエージェントに、これらのパスをファイル・ディレクトリ・glob・見つからないパス・".." を含むパスと組み合わせた場合や --max-files・--ref を付けた場合で落ちるテストを探させたが、コードを読んだ範囲で違いが見つからず書けなかった。変異を書き入れて diff の契約テスト（"."・"./"・空の値・"/" と、"." とファイルを並べた場合を含む）を回しても全て通った
- file: crates/remote-merge/src/cli/diff.rs
  change: delete match arm Ok(TargetPath::Symlink{real_path, ..}) in execute_diff
  text: "Ok(TargetPath::Symlink { real_path, .. }) => !real_path.starts_with(root),"
  class: equivalent
  why: この腕が true を返すのは --follow-external-links がないときに symlink の実パスが root_dir の外にある場合だけだが、同じループの先頭の確かめ（path_escapes_root）が同じパス・同じ root_dir・同じ inspect_path の結果で同じ比較をして、先に "outside root_dir" のエラーにして次のパスへ進むため、この腕に来るときは必ず false になる。別の文脈のエージェントに、相対や symlink を経由する root_dir、機密のリンク、ディレクトリ symlink とその子、走査の三つの経路、--force・--max-entries・--max-files の組み合わせで出力が変わる入力を探させたが、コードを読んだ範囲で見つからず書けなかった（inspect_path はローカル・SSH・エージェントのどれもキャッシュを持たず同じ入力に同じ結果を返す）
- file: crates/remote-merge/src/service/diff.rs
  change: delete match arm engine::DiffResult::Equal in build_diff_output
  text: "engine::DiffResult::Equal => Some(vec![]),"
  class: equivalent
  why: 左と参照先の差を作る match で、この腕を消すと Equal は最後の `_ => Some(vec![])` の腕に入り、消した腕と同じ値を返す。どちらの腕にも副作用はない。別の文脈のエージェントに、公開された build_diff_output を参照先の中身を左と同じにして（Equal の経路を通して）呼び、左右に差がある組・左右とも同じ組・左が空の組で ref_hunks とその JSON を確かめるテストを書かせたが、変異を書き入れても通り、落ちるテストを書けなかった
