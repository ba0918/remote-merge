[package]
name = "remote-merge-ssh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
remote-merge-config = { path = "../remote-merge-config" }
anyhow = "1"
russh = "0.64"
tokio = { version = "1", features = ["full"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
dirs = "7"
remote-merge-settings = { path = "../remote-merge-settings" }
rpassword = "7"
zeroize = "1"
remote-merge-core = { path = "../remote-merge-core" }
tracing = "0.1"

# libc は、テストが利用者の known_hosts を使うことを止める見張り（test-utils とテスト）だけが使う
[target."cfg(unix)".dependencies]
libc = { version = "0.2", optional = true }

[features]
test-utils = ["dep:libc"]

[dev-dependencies]
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
tempfile = "3"

[target."cfg(unix)".dev-dependencies]
libc = "0.2"

[lints]
workspace = true
