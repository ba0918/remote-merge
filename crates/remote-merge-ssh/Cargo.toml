[package]
name = "remote-merge-ssh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
remote-merge-config = { path = "../remote-merge-config" }
anyhow = "1"
russh = "0.63"
tokio = { version = "1", features = ["full"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
dirs = "7"
remote-merge-settings = { path = "../remote-merge-settings" }
rpassword = "7"
zeroize = "1"
remote-merge-core = { path = "../remote-merge-core" }
tracing = "0.1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[features]
test-utils = []

[dev-dependencies]
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
remote-merge-core = { path = "../remote-merge-core", features = ["test-utils"] }
serial_test = "3"
tempfile = "3"

[lints]
workspace = true
