[package]
name = "remote-merge-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
glob-match = "0.2"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
similar = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = { version = "3", optional = true }

[features]
## 試験の道具を公開する（ほかの crate の試験向け）
test-utils = ["dep:tempfile"]

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.149"
tempfile = "3"
