[package]
name = "remote-merge-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
glob-match = "0.2"
thiserror = "2"
anyhow = "1"
similar = "3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = { version = "3", optional = true }
encoding_rs = { version = "0.8.42", default-features = false, features = ["alloc"] }

[features]
## 試験の道具を公開する（ほかの crate の試験向け）
test-utils = ["dep:tempfile"]

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.149"
tempfile = "3"

[lints]
workspace = true
