[package]
name = "remote-merge-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
glob-match = "0.2"
tracing = "0.1"
thiserror = "2"
toml = "0.8"
anyhow = "1"
similar = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0.149"
