[package]
name = "remote-merge"
version = "0.3.3"
edition.workspace = true
rust-version.workspace = true
description = "CLI tool for comparing and merging files between local and remote servers via SSH"

[dependencies]
remote-merge-engine = { path = "../remote-merge-engine" }
remote-merge-agent = { path = "../remote-merge-agent" }
remote-merge-config = { path = "../remote-merge-config" }
remote-merge-ssh = { path = "../remote-merge-ssh" }
remote-merge-protocol = { path = "../remote-merge-protocol" }
remote-merge-core = { path = "../remote-merge-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "7"
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde_json = "1.0.149"
libc = "0.2"
rpassword = "7"
zeroize = "1"

[features]
## テスト用ユーティリティを公開する（インテグレーションテスト向け）
test-utils = ["remote-merge-ssh/test-utils"]

[dev-dependencies]
sha2 = "0.11"
remote-merge-core = { path = "../remote-merge-core", features = ["test-utils"] }
russh = "0.64"
walkdir = "2"
libc = "0.2"
tempfile = "3"
proptest = "1.11.0"
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }

[[test]]
name = "ssh_integration"
required-features = ["test-utils"]

[[test]]
name = "agent_ssh_deploy"
required-features = ["test-utils"]

[lints]
workspace = true
